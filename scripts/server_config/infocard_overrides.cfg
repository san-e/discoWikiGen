852849=BMM) ID
852850=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>Bretonia Mining and Manufacturing (BMM) is one of the largest commercial concerns in Bretonia, a network of semi-autonomous operations that range throughout Bretonian space. Alongside Bowex, they form an industrial partnership and conglomerate that curries the lion's share of government contracts and favor.</TEXT><PARA/><TEXT></TEXT><PARA/><TEXT>This BMM) ID is used by Bretonia Mining and Manufacturing Official Faction, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack Mollys.</TEXT><PARA/><TEXT>- Can engage in piracy against competitors outside of House Space.</TEXT><PARA/><TEXT>- Can engage in piracy against ships carrying Wildcat Gold.</TEXT><PARA/><TEXT>- Cannot use Cruisers, Battlecruisers, or Battleships.</TEXT><PARA/><TEXT></TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Bretonia +1, Omegas, Taus</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships considered hostile by Bretonia.</TEXT><PARA/><TEXT>- Can attack competitors outside of Bretonia.</TEXT><PARA/><TEXT>- Can engage in piracy against Corporate ships outside of Bretonia.</TEXT><PARA/><TEXT>- Can enforce Bretonian laws in Dublin.</TEXT><PARA/><TEXT></TEXT><PARA/><TRA color="default"/><TEXT>Mining Bonuses: Gold Ore (3.5x), Niobium Ore (3.5x), Silver Ore (3.5x)</TEXT><PARA/><TEXT></TEXT><PARA/><POP/></RDL>

