852835=SCRA| Sirius Coalition Revolutionary Army ID
852836=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Coalition consists of descendants of the Coalition forces that stowed away on the Hispania and sabotaged the ship before it arrived in the Sirius sector, and people who sympathise with their cause and have joined them. They are considered enemies by all five houses, but cooperate with the Mollys and Red Hessians.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Independent Military official faction ID is used by Sirius Coalition Revolutionary Army servicemembers, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Cannot use ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Omegas +1, Bretonia, Dublin, Rheinland</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack combat ships considered hostile by the Coalition.</TEXT><PARA/><TEXT>- Can engage in piracy against ships considered hostile by the Coalition.</TEXT><PARA/><TEXT>- Can enforce laws in Omega-52.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

