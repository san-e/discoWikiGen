; (=)"Crimson.Veil" (=)"Crimson.Veil"
852993= Crimson ID
852994= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>Crimson Veil is a notable member of the Platform, an anarchist sect within the larger Bundschuh. Subjected to Ageira's experiments as a child, she gained some of the abilities typically associated with Nomads. Often acting as a diplomatic envoy, she seeks to strengthen and expand the power and influence of the Platform in particular and the Bundschuh in general.</TEXT><PARA/><TEXT></TEXT><PARA/><TEXT>The owner of this SRP ID is Crimson Veil, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack Alien ships.</TEXT><PARA/><TEXT></TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Rheinland +1, Sigmas, Omega-3, Pennsylvania, Texas, Zurich</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack Rheinland Lawful, Rheinland Corporation ships</TEXT><PARA/><TEXT>- Can attack combat ships.</TEXT><PARA/><TEXT>- Can engage in piracy.</TEXT><PARA/><TEXT></TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Outside Zone of Influence </TEXT><TRA bold="true"/><TEXT></TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Must only attack in self-defense while using Cruisers or Battlecruisers except in defense of (=) Platform ships.</TEXT><PARA/><TEXT></TEXT><PARA/><TRA color="default"/><POP/></RDL>

