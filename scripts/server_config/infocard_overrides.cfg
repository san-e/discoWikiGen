853001= Bristol Miner ID
853002= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>Bristol Constructions &amp; Manufacturing is an independent corporation specializing in station construction, salvaging and mining operations. They often compete with Junkers and other independent corporations for high-value salvage in the war-torn fringes of Sirius.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Independent Corporate ID is used by Bristol Constructions employees, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can engage in piracy against competitors outside of House Space.</TEXT><PARA/><TEXT>- Cannot use Cruisers, Battlecruisers, Battleships, or ships with more than 4,300 cargo.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Liberty +1, Hamburg, Inverness, Copernicus, Vespucci</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships considered hostile by Bristol Constructions.</TEXT><PARA/><TEXT>- Can attack competitors.</TEXT><PARA/><TEXT>- Can engage in piracy outside of House Space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TEXT>Mining Bonuses: Iridium Ore (1.5x), Aluminium Ore (1.5x), Copper Ore (3x), Gold Ore (1.5x), Helium-3 (1.5x), Niobium Ore (1.5x), Platinum Ore (1.5x), Uncut Diamonds (1.5x), Silver Ore (1.5x)</TEXT><PARA/><TEXT> </TEXT><PARA/><POP/></RDL>

;SRP 13(dsy_license_srp_13) - FRS-Roanoke
853003= FRS-Roanoke
853004= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The prototype Interdictor-class battlecruiser Roanoke was originally launched by the Hellfire Legion and served its cause before the Legion was reformed into the Liberty Insurgency. There it served as a special heavy and long range recon vessel up until 829 AS, when the ship defected from the Insurgency and found its way into the Xenos' Liberty Free Republic.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>Currently, the modified battlecruiser Roanoke flies under the LFR's colors and is commanded by Captain Belle.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Liberty Unlawful ID is used by the FRS Roanoke, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack any ship to protect allies.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Liberty +1, Coronado, Copernicus, Inverness, Shikoku, Vespucci</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack combat ships.</TEXT><PARA/><TEXT>- Can engage in piracy.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

