853705=Liberty Navy 46th Fleet ID
853706=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The 46th Fleet is the youngest of the Liberty Navy's primary formations. Initially a mere strike force formed to serve as a proving ground for cadets fresh out of West Point, a recent naval restructuring has seen the 46th ascend to the status of a full, numbered fleet. Despite incurring much critique during its early days due to its use of controversial tactics, the 46th Fleet has since earned its rightful place among its more veteran counterparts. The 46th Fleet's units can frequently be seen patrolling Liberty's shipping lanes, safeguarding her borders, and fending off attacks, both foreign and domestic.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Liberty Navy Official Faction ID is used by service members of the 46th Fleet, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Cannot use ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Liberty +1, Coronado, Vespucci, Shikoku</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships considered hostile by Liberty.</TEXT><PARA/><TEXT>- Can attack Kusari combat ships.</TEXT><PARA/><TEXT>- Can demand Superconductors and Nanocapacitors in Galileo and Kepler.</TEXT><PARA/><TEXT>- Can enforce laws within Liberty.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

