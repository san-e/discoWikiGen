852565=Liberty Police ID
852566=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>Liberty Police, Inc. (LPI) is a private company that handles the policing of Liberty space to interdict the importation of contraband and to prevent attacks on civilian and commercial traffic.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Liberty Corporate Police ID is used by employees of Liberty Police, Inc., who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Cannot use Battleships or ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Liberty +1</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships considered hostile by Liberty.</TEXT><PARA/><TEXT>- Can attack Kusari combat ships.</TEXT><PARA/><TEXT>- Can demand Superconductors and Nanocapacitors in Galileo and Kepler.</TEXT><PARA/><TEXT>- Can enforce laws within Liberty.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

;dsy_license_br_p_grp
852569=Bretonia Police Authority ID
852570=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>Officers in the Bretonia Police Authority are well-trained, well-armed, and widely considered to be a bastion of incorruptibility. They are also spread few and far between, depleted from conscription into two bloody wars and the ensuing criminal uprisings that followed.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Bretonian Police ID is used by constables of the Bretonia Police Authority, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Cannot use Battleships or ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Bretonia +1</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships considered hostile by Bretonia.</TEXT><PARA/><TEXT>- Can enforce laws within Bretonia, Dublin, and Omega-3.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

;dsy_license_ku_p_grp
852573=Kusari State Police ID
852574=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Kusari State Police are the highly disclipined police force of Kusari, infamous for their distrust of foreigners. They settle disputes, protect civilians and hunt criminals within Kusari.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Kusari Police ID is used by officers in the Kusari State Police, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Cannot use Battleships or ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Kusari +1</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships considered hostile by Kusari.</TEXT><PARA/><TEXT>- Can attack Liberty combat ships.</TEXT><PARA/><TEXT>- Can demand Optronics and Quantum Multiplexors in Galileo and Kepler.</TEXT><PARA/><TEXT>- Can enforce laws within Kusari and Tohoku.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

;dsy_license_rh_p_grp
852577=Rheinland Federal Police ID
852578=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Rheinland Federal Police (RFP) are the federated police forces of Rheinland, providing security and law enforcement to their respective systems.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Rheinland Police ID is used by officers of the Rheinland Federal Police, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Cannot use Battleships, or any ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Rheinland +1</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships considered hostile by Rheinland.</TEXT><PARA/><TEXT>- Can enforce laws within Rheinland, Cologne, Dresden Sigma-15 and Omega-7.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

;dsy_license_li_lsf_grp
852697=Liberty Security Force ID
852698=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Liberty Security Force (LSF) is the intelligence branch of the Liberty Armed Forces, operating in secrecy to ensure the free flow of goods and services in the Liberty economy. LSF agents are infamous for their broad authority and oversight over the rest of the Armed Forces.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Liberty Intelligence ID is used by operatives of the Liberty Security Force (LSF), who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack Combat Ships considered hostile by Liberty.</TEXT><PARA/><TEXT>- Can engage in piracy against ships considered hostile by Liberty.</TEXT><PARA/><TEXT>- Can attack Intelligence ships.</TEXT><PARA/><TEXT>- Can demand Alien equipment and materials.</TEXT><PARA/><TEXT>- Can demand Superconductors and Nanocapacitors from Kusari ships.</TEXT><PARA/><TEXT>- Cannot use Battleships, or ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Liberty +1, Coronado, Vespucci, Shikoku</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships considered hostile by Liberty.</TEXT><PARA/><TEXT>- Can attack Kusari combat ships.</TEXT><PARA/><TEXT>- Can enforce laws within Liberty.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TEXT>Outside Zone of Influence:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Must only attack in self-defense while using Cruisers or Battlecruisers.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

;dsy_license_bretoniaintel
852783=Bretonian Intelligence Service ID
852784=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Bretonia Intelligence Service is the Bretonian covert operations service, specialising in sabotage and subterfuge outside of core Bretonian space. They work closely with the Crown to ensure their goals abroad are met, even if they must resort to unsavory tactics and underhanded conspiracies.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Bretonian Intelligence ID is used by Bretonian Intelligence Service operatives, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack combat ships considered hostile by Bretonia.</TEXT><PARA/><TEXT>- Can engage in piracy against ships considered hostile by Bretonia.</TEXT><PARA/><TEXT>- Can attack Gallic combat ships within the Taus.</TEXT><PARA/><TEXT>- Can attack Intelligence ships.</TEXT><PARA/><TEXT>- Can demand Alien equipment and materials.</TEXT><PARA/><TEXT>- Cannot use Battleships, or ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Bretonia +1, Omegas, Inverness</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships considered hostile by Bretonia.</TEXT><PARA/><TEXT>- Can enforce laws within Bretonia, Dublin, and Omega-3.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TEXT>Outside Zone of Influence and the Taus:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Must only attack in self-defense while using Cruisers or Battlecruisers.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

; dsy_license_kempetei
852756=Kusari Office of Intelligence ID
852757=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Kusari Office of Intelligence operates as an independent bureau of the Empire, performing clandestine operations in regions predominantly beyond the reach of the Naval Forces.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Kusari Intelligence ID is used by operatives in the Kusari Office of Intelligence, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack combat ships considered hostile by Kusari.</TEXT><PARA/><TEXT>- Can attack Gallic combat ships within the Taus.</TEXT><PARA/><TEXT>- Can attack Intelligence ships.</TEXT><PARA/><TEXT>- Can engage in piracy against ships considered hostile by Kusari.</TEXT><PARA/><TEXT>- Can demand Alien equipment and materials.</TEXT><PARA/><TEXT>- Can demand Optronics and Quantum Multiplexors from Liberty ships.</TEXT><PARA/><TEXT>- Cannot use Battleships, or ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Kusari +1, Liberty, Sigmas</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships considered hostile by Kusari.</TEXT><PARA/><TEXT>- Can attack Liberty combat ships.</TEXT><PARA/><TEXT>- Can enforce laws within Kusari and Tohoku.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TEXT>Outside Zone of Influence and the Taus:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Must only attack in self-defense while using Cruisers or Battlecruisers.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

