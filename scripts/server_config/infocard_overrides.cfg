853695=Civil Defence Initiative ID
853696=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>Special Constables of the Civil Defence Initiative are frequently poorly trained, under-equipped, and widely considered to be of dubious quality. Created during the Gallic War to quickly generate reinforcements for the heavily depleted BPA, the CDI continues in its struggle to maintain law and order to this day. While formally based on Planet Sprague, the Militia undertakes duties throughout Bretonia.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Bretonian Police ID is used by constables of the Civil Defence Initiative, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Cannot use Cruisers, Battlecruisers, Battleships or ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Bretonia +1</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships considered hostile by Bretonia.</TEXT><PARA/><TEXT>- Can demand credits.</TEXT><PARA/><TEXT>- Can enforce laws within Bretonia, Dublin, and Omega-3.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

