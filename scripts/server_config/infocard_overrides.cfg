852647=Gas Miners Guild ID
852648= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Gas Miners Guild (GMG) is a tight-knit professional organization that acts as the primary supplier of H-Fuel to the four major Houses of Sirius. The GMG is closely partnered with Kishiro Technologies, and secretly supports the Blood Dragons, Golden Chrysanthemums, Bundschuh, and the Order.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Independent Corporate ID is used by Gas Miners Guild members, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can engage in piracy against competitors outside of House Space.</TEXT><PARA/><TEXT>- Cannot use Cruisers, Battlecruisers, or Battleships.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Sigmas +1, Kusari +1</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships considered hostile by GMG.</TEXT><PARA/><TEXT>- Can attack Rheinland combat ships outside of House Space.</TEXT><PARA/><TEXT>- Can attack competitors outside of House Space.</TEXT><PARA/><TEXT>- Can engage in piracy against Corporate ships outside of House Space.</TEXT><PARA/><TEXT>- Can enforce laws within the Sigmas.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TEXT>Mining Bonuses: Helium-3 (3x)</TEXT><PARA/><TEXT> </TEXT><PARA/><POP/></RDL>

