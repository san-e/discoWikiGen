852827=(=)- The Platform ID
852828=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Platform is a confederation of Bundschuh sects primarily espousing a far-left, anarchist political ideology. They view states and corporations as inherently exploitative, and as detrimental to human freedom and flourishing. In keeping with these views, the Platform engages in propaganda distribution and guerrilla warfare against Rheinland and its immediate neighbors, and lobbies the wider Bundschuh movement to do the same.</TEXT><PARA/><TEXT></TEXT><PARA/><TEXT>This Rheinland Unlawful ID is used by members of the Bundschuh, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Cannot use Battlecruisers, Battleships, or ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT></TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Rheinland +1, Sigmas, Omega-3, Pennsylvania, Texas, Zurich</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack combat ships.</TEXT><PARA/><TEXT>- Can attack Rheinland Lawful, Rheinland Corporation ships</TEXT><PARA/><TEXT>- Can engage in piracy.</TEXT><PARA/><TEXT></TEXT><PARA/><TRA color="default"/><POP/></RDL>

; dsy_license_pf_03_grp
852829=R\- Die Rote Front ID
852830= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Red Front is a major brigade within the greater Red Hessian movement that focuses on deploying heavy assets and accomplishing large-scale operations using sheer firepower. The Front strongly harkens back to the founding ideals of old, without which the Hessian movement would inevitably turn on itself and fall into dissolution.</TEXT><PARA/><TEXT></TEXT><PARA/><TEXT>This Rheinland Unlawful ID is used by members of the Red Hessian Front, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships carrying Artifacts and Xeno Relics.</TEXT><PARA/><TEXT>- Can attack Daumann, Kruger in Omega 11, Omega 7, Dresden</TEXT><PARA/><TEXT>- Cannot use ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT></TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within their Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Rheinland, Omegas +1, Cologne, Zurich, Sigma-15</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack combat ships.</TEXT><PARA/><TEXT>- Can engage in piracy.</TEXT><PARA/><TEXT></TEXT><PARA/><TRA color="default"/><TEXT>Mining Bonuses: Uncut Diamonds (3.5x)</TEXT><PARA/><TEXT></TEXT><PARA/><POP/></RDL>


; dsy_license_pf_04_grp
852831=Aegis Initiative ID
852832=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Aegis Initiative is a private military company registered under the Bounty Hunters Guild with an extensive zone of operation encompassing much of Sirius. They will go to any length to increase their bottom line, such as removing their competitors, hiring dangerous ex-criminals and military pilots, employing legally dubious equipment and accepting hefty bribes from their targets. They work closely with The Core, Bretonia, Kusari and Liberty.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Independent Corporate ID is used by Bounty Hunters, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack any ship to protect Police, Military, or Corporate ships.</TEXT><PARA/><TEXT>- Can attack Unlawful combat ships.</TEXT><PARA/><TEXT>- Can attack any ship that is the target of a contract.</TEXT><PARA/><TEXT>- Can attack other bounty hunting organisations outside of house space targeting the same bounty.</TEXT><PARA/><TEXT>- Cannot use Cruisers except the Bastion and Vanguard, Battlecruisers, Battleships or ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

