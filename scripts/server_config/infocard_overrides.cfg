852564=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Liberty Navy is responsible for protecting the economic well-being of Liberty through military force, both within the boundaries of the colony and in the independent systems that border its territory.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Liberty Military ID is used by Liberty Navy servicemembers, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Cannot use ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Liberty +1, Coronado, Vespucci, Shikoku</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships considered hostile by Liberty.</TEXT><PARA/><TEXT>- Can attack Kusari combat ships.</TEXT><PARA/><TEXT>- Can demand Superconductors and Nanocapacitors in Galileo and Kepler.</TEXT><PARA/><TEXT>- Can enforce laws within Liberty.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

