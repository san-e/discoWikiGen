60003=Abandoned Listening Post
60004=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>An abandoned Kusari listening post, likely dating to the 820s. The structure appears to have once held a small crew, with external latch-moors for securing and refuelling fighters. There are currently no signs of power or life.</TEXT><PARA/><POP/></RDL> 

60005=Tsumi
60006=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>This Imperial Kusari heavy fighter has been heavily damaged, particularly to the fuselage and cockpit. Livery painted across the vessel indicates it once belonged to The Exiles, who triggered the Kusari Civil War in 825 AS. The ship appears to have managed to limp back to the hidden listening post it was staging from.</TEXT><PARA/><POP/></RDL>

60009=Shirahama-maru
60010=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Shirahama-maru is a light ferry that routinely carries passengers between Planet New Tokyo and Aomori Station.</TEXT><PARA/><POP/></RDL>

60011=Yonakuni-maru
60012=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Yonakuni-maru is an armored ferry that routinely carries passengers from Newport Station across the Rheinland border.</TEXT><PARA/><POP/></RDL>

60015=Gertrud
60016=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Gertrud is a budget ferry that routinely carries passengers between Planet New Berlin and Mainz Station.</TEXT><PARA/><POP/></RDL>

60017=Espagne
60018=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Espagne is a chartered luxury passenger ferry, hired by EFL to transport officials and dignitaries between Planet New Berlin and Wildau Station.</TEXT><PARA/><POP/></RDL>

60019=Sigma-13 Battlezone (BS)
60020=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Nomad incursion into the Sigma systems has been met in force by The GMG, Order, and Kusari. Despite the ongoing crisis, Kusari and the Order have thus far been unable to settle their differences.</TEXT><PARA/><POP/></RDL>

;-----Staff In-Game Overwrites------

656167=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TRA data="1" mask="1" def="-2"/><JUST loc="center"/><TEXT>"Bustard" Civilian Light Carrier</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA data="65281" mask="-31" def="30"/><TEXT>For the purposes of ID ship class restrictions, this ship is classified as a Transport. For all other purposes, this ship is a Combat Ship.</TEXT><PARA/><TRA data="96" mask="-31" def="-1"/><JUST loc="left"/><TEXT>  </TEXT><PARA/><TEXT>Designed and manufactured to serve in dark corners of space where the closest friendly base is but a memory; the Bustard is a mobile retreat point intended for snubcraft operating away from friendly installations.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>The Bustard was designed with the intention of avoiding the sheer cost and quantity of resources manufacturing and maintaining a military carrier requires, and so, sacrificing combat capabilities of a warship, its design leans toward availability and ease of maintenance, and so becomes a practical choice of carrier for smaller groups lacking the means of maintaining an actual warship. </TEXT><PARA/><POP/></RDL>

656447=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TRA data="1" mask="1" def="-2"/><JUST loc="center"/><TEXT>Edison AM-333 "Hegemon" Civilian Asteroid Miner</TEXT><PARA/><PARA/><TRA data="65281" mask="-31" def="30"/><TEXT>This ship can be used regardless of cargo capacity limitations of your ID.</TEXT><PARA/><TRA data="96" mask="-31" def="-1"/><TRA data="0" mask="1" def="-1"/><JUST loc="left"/><TEXT> </TEXT><PARA/><TEXT>The venerable Hegemon has been in service for many decades with only minor changes to the design. Every few years, a new power core gets swapped in, the shield generators get upgraded, and the windows get polished, but otherwise the core elements have stayed the same since 720 AS This is mostly because, until the development of the Annapurna, the Hegemon had no competition, due to its continuing good performance. The ship's sheer bulk makes it difficult to move, but is necessary to house the integrated mineral processing machinery. However, this is usually a worthwhile trade off, since factories will pay a premium for high-purity materials.</TEXT><PARA/><POP/></RDL>

