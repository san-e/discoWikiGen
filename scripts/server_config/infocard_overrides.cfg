787197=Kusari Rioter
787198=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TRA data="1" mask="1" def="-2"/><JUST loc="center"/><TEXT>KUSARI RIOTERS</TEXT><PARA/><TRA data="0" mask="1" def="-1"/><JUST loc="left"/><PARA/><TEXT>This pilot joined an unruly protest in Galileo, following the assassination of Kusari's Admiral Goro Okamoto. They have since been swept up in a State Police crackdown, and manipulated by shadowy factions within Kusari's government.</TEXT><PARA/><POP/></RDL>

