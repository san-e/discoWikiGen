852653=Zoner ID
852654= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>Zoners are a diverse group of individuals who, for their own reasons, have struck out to live in the untamed worlds beyond House control. Most Zoner communities are freeports, small yet vibrant markets on the edge of civilized space open to anyone, so long as they keep the peace.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Independent Quasilegal ID is used by Zoners, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships considered hostile by Zoners outside House Space.</TEXT><PARA/><TEXT>- Can enforce laws in systems containing a Zoner base.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TEXT>Inside House Space:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Cannot dock Cruisers, Battlecruisers, Battleships, or ships with more than 3,600 cargo space, except in Pennsylvania.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TEXT>Mining Bonuses: Iridium Ore (3x), Heavy Water (3x)</TEXT><PARA/><TEXT> </TEXT><PARA/><POP/></RDL>

;K'Hara ID
852727=K'Hara ID
852728= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Nomads are organic guardians left behind by an ancient alien civilization. Over thousands of years, Nomads evolved into well-organized beings, forming a civilization of their own - one that is extremely hostile to all save their former masters.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Alien official faction ID is used by the Slomon K'Hara, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack any ship.</TEXT><PARA/><TEXT>- Cannot engage in piracy.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

