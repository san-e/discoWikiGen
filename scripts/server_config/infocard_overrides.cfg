852634=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Lane Hackers are a criminal group in Liberty who focus on piracy of high-value targets. They prefer to attack Ageira, Universal, Interspace and DSE ships, or shipments of high-tech equipment, especially Trade Lane and Jump Gate components.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Liberty Unlawful ID is used by Lane Hackers, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can engage in piracy against Ageira, Interspace, or any ships carrying Ageira Gate/Lane Parts.</TEXT><PARA/><TEXT>- Cannot use Cruisers, Battlecruisers, Battleships, or ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Liberty +1, Copernicus, Coronado, Leeds, Manchester, Inverness, Shikoku, Vespucci</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack combat ships.</TEXT><PARA/><TEXT>- Can engage in piracy.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

