787173=Wild Experimental Research
787174=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TRA data="1" mask="1" def="-2"/><JUST loc="center"/><TRA data="0" mask="1" def="-1"/><JUST loc="left"/><TEXT>During the long isolation of Omega-58, the surviving Wild of Kaarst Station went back into stasis. A small number remained awake, as sentinels, passing time by carrying out horrifying experiments on their remaining human hosts. The technologies derived from this barbarity are now being shipped back to the deep Omicrons for incorporation into the Nomad arsenal.</TEXT><PARA/><POP/></RDL>

