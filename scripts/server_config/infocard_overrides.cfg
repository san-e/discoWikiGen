852575=Rheinland Military ID
852576=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Rheinland Military serves as both protector of the recently-reunified Federal Empire, and a symbol of the traditions they hope to return to.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Rheinland Military ID is used by Rheinland Military servicemembers, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack GMG combat ships within the Sigmas.</TEXT><PARA/><TEXT>- Cannot use ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Rheinland +1, Omega-3, Zurich</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships considered hostile by Rheinland.</TEXT><PARA/><TEXT>- Can enforce laws within Rheinland, Cologne, Dresden and Sigma-15.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

