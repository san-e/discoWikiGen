853154=Asmodeus ID
853155=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>After the fall of Toledo the wreck of the Amenhotep was discovered by Order Agent Jonathan Kalh, and towed from Omicron Minor to Fort Carthage for repair. Impressed with Kalh's dedication, the Order made him the vessel's Captain and deployed him to Liberty and the surrounding systems. Later betrayed by the Order after aiding them in the destruction of a Nomad Hypergate in Coronado, Kalh sought refuge in the Liberty Navy 5th Fleet. Years later Kalh's mental state had deteriorated, causing him to break off from the 5th and seek out his own destiny. Unprepared for what awaited him in the Omicrons, Kalh was mortally wounded and his body was placed in a mechanical life-support suit. Reborn, he would soon change his name to Asmodeus and begin a crusade against what he called "Corruption".</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack any ship.</TEXT><PARA/><TEXT>- Can demand Artifacts, Azurite Gas, and Nomad equipment or materials.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

;SRP 28(dsy_license_srp_28) - Vile Scorn
853156=Vile Scorn
853157=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Vile Scorn is an independent pirate ship under the command of Mathias Grendel, the vessel is infamous for its ruthless attacks on shipping and commerce on the borders of Rheinland.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Independent Unlawful ID is used by Mathias Grendel of the Vile Scorn, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack any ship to protect allies.</TEXT><PARA/><TEXT>- Can engage in piracy.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

;SRP 29(dsy_license_srp_29) A/)-ACV-Achlys
853158=A/)-ACV-Achlys
853159=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Technocracy of Auxo is an isolationist, transhuman microstate committed to boundless science and the accumulation of knowledge and technology. They are at ideological conflict with the Core and Order, believing their greed and wrath against non-Humans to be the decline of technology and the inevitable elimination of knowledge. Despite their skeptical outlook on outsiders and enigmatic behaviour, they will welcome any ethnicity to integrate into their society, presenting themselves as the transhuman doppelganger to the Nomad infection.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Independent Intelligence official faction ID is used by technocrats of the Technocracy of Auxo, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack Core and Intelligence ships.</TEXT><PARA/><TEXT>- Can demand Alien materials and Cardamine.</TEXT><PARA/><TEXT>- Cannot use Cruisers, Battlecruisers, or ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Bretonia +1, Liberty, Inverness, Kansas, Vespucci, Omegas, Omicrons</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships considered hostile by the Technocracy of Auxo.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TEXT>Mining Bonuses: Azurite Gas (4x), Xeno Relics (4x)</TEXT><PARA/><TEXT> </TEXT><PARA/><POP/></RDL>

;SRP 30(dsy_license_srp_30) RV-Pennybrooke
853160=Katherine Pennybrooke
853161=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>Katherine Pennybrooke is a Bretonian freelance explorer and researcher who works mainly in the Edge Worlds, though she makes occasional appearances in the houses, pursuing information about new political developments. She is known to have a background in atmospheric physics, but appears to have taken a keen interest in the Nomads, and has been seen in their company on many occasions, seemingly accepted by them.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Independent SRP ID is used by Katherine Pennybrooke, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack any ship in the Omicrons.</TEXT><PARA/><TEXT>- Can attack any ship to protect Alien ships.</TEXT><PARA/><TEXT>- Can attack any ship that is the target of a contract.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

;SRP 31(dsy_license_srp_31) Battleship Klaxon
853162=Battleship Klaxon
853163=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>Battleship Klaxon is one of the last &apos;Monument&apos;-class dreadnoughts still in service in Sirius. Originally laid down in 788 AS, she served in the Liberty Navy for decades, and helped enforce martial law in Texas during the Nomad War (800 - 801 AS). Scheduled for decommissioning, she was pushed back into service as an electronic warfare and backline support ship during the Gallic War.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>The captain gave the order to defend the LNS Harmony at Norfolk Shipyard in 823 AS, and afterward the Klaxon slipped into the shadows, serving mostly as a refueling post for Insurgent patrols once Harmony joined forces with the Hellfire Legion. During the fall of Veracruz, Battleship Klaxon disappeared in the Guerrero Cloud, and has since resurfaced in Rheinland flying the colors of the Bundschuh.</TEXT><PARA/><TEXT>This Independent SRP ID is used by the Klaxon, who:</TEXT><PARA/><TRA color="white"/><TEXT> </TEXT><PARA/><TEXT>- Can attack Liberty Police, Military, and Intelligence ships.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Rheinland +1</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TEXT></TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack Combat Ships.</TEXT><PARA/><TEXT>- Can engage in piracy.</TEXT><PARA/><POP/></RDL>

;SRP 32(dsy_license_srp_32) - Caliban
853164=Caliban
853165=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>From the ashes of a former wannabe xenobiologist rose a pilot whose goals stretch across the better half of Sirius. Vincent "Caliban" Abrams is a dedicated fixer, arms dealer and above all else a mercenary with a very flexible moral compass.</TEXT><PARA/><TEXT></TEXT><PARA/><TEXT>Not wanting to live in regret and misery after years of self-sacrifice in the face of an impossible enemy, Caliban has decided to adopt a more care-free lifestyle by putting himself above all else save for the constant threat posed by aliens.</TEXT><PARA/><TEXT></TEXT><PARA/><TEXT>This Independent Quasilegal ID is used by Caliban, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT></TEXT><PARA/><TEXT>- Can demand alien materials.</TEXT><PARA/><TEXT>- Can attack any ship that is the target of a contract.</TEXT><PARA/><TEXT>- Can attack Liberty Lawfuls, Technocracy, The Order.</TEXT><PARA/><TEXT>- Can attack combat ships who are associated with Liberty, Technocracy, The Order, Aliens.</TEXT><PARA/><PARA/><TRA color="default"/><TRA color="default" bold="true"/><POP/></RDL>

;SRP 33(dsy_license_srp_33) - Anna Heinrich, Lipstick Reaver
853166=Anna Heinrich
853167=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>This unlawful ID is used by Anna Heinrich, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack any ship that is the target of a contract.</TEXT><PARA/><TEXT>- Can fulfill lawful and unlawful bounty contracts.</TEXT><PARA/><TEXT>- Can only use the Odin Mk.I and Thor Mk.I.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

;SRP 34(dsy_license_srp_34) - Stormhawk
853168=Stormhawk 
853169=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Stormhawk is part of a Unit known as Delta 4. Their goal is to rid Sirius of Nomads and their supporters wherever they are found.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Independent Quasilegal ID is used by the Stormhawk of Delta 4, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack any ship carrying Alien materials outside House Space.</TEXT><PARA/><TEXT>- May only dock on Zoner bases within House Space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

;SRP 35(dsy_license_srp_35) - LPI-BW-Leavenworth
853170=LPI-BW-Leavenworth
853171=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>Liberty Police, Inc. (LPI) is a private company that handles the policing of Liberty space to interdict the importation of contraband and to prevent attacks on civilian and commercial traffic.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Liberty Corporate Police ID is used by the captain of the Leavenworth, who:</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Liberty +1</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships considered hostile by Liberty.</TEXT><PARA/><TEXT>- Can enforce laws within Liberty.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

;SRP 36(dsy_license_srp_36) - LPI-BW-Excelsus
853172=LPI-BW-Excelsus
853173=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>Liberty Police, Inc. (LPI) is a private company that handles the policing of Liberty space to interdict the importation of contraband and to prevent attacks on civilian and commercial traffic.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Liberty Corporate Police ID is used by the captain of the Leavenworth, who:</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Liberty +1</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships considered hostile by Liberty.</TEXT><PARA/><TEXT>- Can enforce laws within Liberty.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

;SRP 37(dsy_license_srp_37) - Wilde.Einbeck
853174=Wilde.Einbeck
853175=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>Built at the behest of Chancellor Niemann, the RNC Einbeck served in the Northern Rheinland Fleet, retrofitted with alien technology aboard Schatten. The Donau-class cruiser took part in many battles, from the capital of Kusari and into the depths of the Omicrons and Omegas, shaping more than one story of ghost ships roaming the Border Worlds and preying upon unsuspecting captains. After a botched defence attempt of a Wild base in Rheinland, the Donau's hull was further reinforced with Wild Hunt's matterweave -- creating a design combining not only the technology of the Nomads and that of humankind, but also the knowledge of all those it captured, in a sadistic attempt to mimic the Scorpion drone's capabilities.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Alien SRP ID is used by the infected captain of the RNC Einbeck, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack any ship to protect allied Alien ships.</TEXT><PARA/><TEXT>- Cannot demand credits. </TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Rheinland +1, Sigmas, Omegas, Omicrons, Systems containing an allied Alien base +1</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack any ship.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

;SRP 38(dsy_license_srp_38) - Askunu|Aoi
853176= Askunu|Aoi
853177= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Askunu, formerly known as the KDS Asuka, is a Takeda-class Kusari Destroyer originally pressed into service in 823 AS. After it was sent on an expedition to Omicron Zeta, it was ambushed by Aoi Iseijin-affiliated Kusari forces and was left in the freezing cold of Planet Palmyra. Later, in 828 AS, Krumai and her followers found the Askunu and repurposed it as the flagship of Imra's Followers, even after the dissolution of the Aoi Iseijin. However, as of 834 AS, Krumai left Imra's Followers, and has since pursued her own ambitions.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Alien SRP ID is used by Krumai, the infected captain of the Askunu, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack any ship to protect allied Alien ships.</TEXT><PARA/><TEXT>- Cannot demand credits.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Kusari +1, Sigmas, Omicrons, Taus, and systems containing an allied Alien base</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack any ship.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

;SRP 39(dsy_license_srp_39) - Lea Kaufman
853178= Lea Kaufman
853179= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>Lea Kaufman is a mercenary working for her own account. Having accomplished some jobs from The Core's former guild master, she had gained a certain reputation. However, with lack of jobs from the main contractors, she had to find another way to gain a living. And for that, she is ready to any type of jobs. From escort to the most questionable ones.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Independent SRP ID is used by Lea Kaufman, who: </TEXT><PARA/><TRA color="white"/><TEXT> </TEXT><PARA/><TEXT>-Can attack any ship to defend allies.</TEXT><PARA/><TEXT>-Can assist any ship while pursuing a contract.</TEXT><PARA/><TEXT>-Can attack any ship in pursuit of a contract.</TEXT><PARA/><POP/></RDL>

;SRP 40(dsy_license_srp_40)
853180= GCC|Amalfi
853181= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Amalfi is a unique Storta-class destroyer that has been extensively modified to extend its operation range, sensors, communications, and hangar bays. Internally, the vessel is more of a luxurious yacht than a proper warship and serves as a mobile base and home for the young Outcast known as Fiorella Arianna de Marco.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Independent Unlawful SRP ID is used by Fiorella de Marco, who:</TEXT><PARA/><TRA color="white"/><TEXT> </TEXT><PARA/><TEXT>- Can attack any combat ship outside of House Space.</TEXT><PARA/><TEXT>- Can engage in piracy outside of House Space.</TEXT><PARA/><TEXT>- Can attack any ship in defense of allied ships.</TEXT><PARA/><TEXT>- Can attack any ship in pursuit of an Outcast-issued individual bounty contract.</TEXT><PARA/><TEXT>- Can attack any Alien ship, or any ship assisting an Alien ship.</TEXT><PARA/><PARA/><TEXT> </TEXT><PARA/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Omicron Alpha +1</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack any ship.</TEXT><PARA/><POP/></RDL>

;SRP 41(dsy_license_srp_41)
853182= Wilde.Schiller
853183= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>Constructed during the Colony Wars, the RNC Schiller was the flagship of the Western Rheinland Fleet, until a group of Blood Dragons launched a daring raid that routed its flotilla in the Tau-29 system and forced the Schiller to retreat into the Omegas over the following months. With large parts of the hull reconstructed or retrofitted to fit Wild Hunt's schemes, first some time around 815 AS in Omega-58 and then again in 834 AS in Omicron Delta, the RNC Schiller combines human and alien technology into The Wild Hunt's largest achievement so far in shipbuilding and technology interfacing. The Schiller also received upgrades insofar as Wild Hunt's knowledge of matter weaving went, its hull being used as an even greater testament to the thrall's abilities compared to the smaller RNC Einbeck and Scorpion designs.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Alien SRP ID is used by the infected captain of the RNC Schiller, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack any ship to protect allied Alien ships.</TEXT><PARA/><TEXT>- Cannot demand credits. </TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Rheinland +1, Sigmas, Omegas, Omicrons, Systems containing an allied Alien base +1</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack any ship.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

;SRP 42(dsy_license_srp_42) [RM]Kpl-Holger.Lahm
853184= Holger.Lahm
853185= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>Dishonored in the Rheinland Military for doing a reconnaissance mission with an Order pilot, the Rheinland Oberkommando has offered Korporal Lahm as a liason to the Order as to better allow communication between both factions and learn more about the Omicrons.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Rheinland Diplomatic ID is used by [RM]Bmn-Holger.Lahm, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack any ship in self-defense.</TEXT><PARA/><TEXT>- Can assist any Order or Rheinland Military ship.</TEXT><PARA/><TEXT>- Can attack any combat ship belong to a faction considered hostile Rheinland</TEXT><PARA/><TEXT>- Can attack any non-allied Intelligence ships, or factions using Nomad equipment</TEXT><PARA/><TEXT>- Can enforce Rheinland Law in Rheinland Space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within their Zone of Influence  (</TEXT><TRA bold="default"/><TEXT>Rheinland +1, Omega-3, Zurich</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships considered hostile by Rheinland.</TEXT><PARA/><TEXT>- Can enforce laws within Rheinland, Cologne, and Sigma-15.</TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within their Zone of Influence(</TEXT><TRA bold="default"/><TEXT>Omicrons</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can Enforce Order Laws within Omicron Mu and Omicron Minor.</TEXT><PARA/><TEXT>- Can attack any Nomad or Wild ship within Omicrons.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

;SRP 43 (dsy_license_srp_43)
853186= A/)-ACV-Halcyon
853187= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Technocracy of Auxo is a secretive transhumanist society dedicated to the advancement of science, the responsible custodianship of knowledge, and the preservation of sentient life. They favor isolationism as a tactic to safeguard themselves and further their internal academic freedom, relying upon a discreet network of agents and collaborators to observe and interact with the outside world.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>The Technocracy's ideals put them at odds with entities such as The Core and Order, whose greed and wrath against non-humans like the Gammu are seen as counter-productive to the advancement of all species and societies. In spite of the Technocrats' isolation and distrustful outlook towards outsiders, they are known to welcome those from all walks of life should they display true dedication to the cause, presenting themselves as a new form of unity above and outside internecine human struggles.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Independent Intelligence official faction ID is used by technocrats of the Technocracy of Auxo, who:</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>- Can attack Core and Intelligence ships.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>- Can demand Alien materials and Cardamine.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>- Cannot use Battlecruisers, Battleships, or ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>Within Zone of Influence (Bretonia +1, Liberty, Inverness, Kansas, Ontario, Vespucci, Omegas, Omicrons):</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>- Can attack ships considered hostile by the Technocracy of Auxo.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>- Can enforce laws within Inverness, Omega-48, Omicron Pi, Ontario, Kansas, and Vespucci.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>Mining Bonuses: Azurite Gas (4x), Xeno Relics (4x)</TEXT><PARA/><POP/></RDL>

;SRP 44(dsy_license_srp_44) Unit-9467F
853188= Novak
853189= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>Novak, formerly called Unit-9467F, is an Artificial Intelligence discovered in April of 810 A.S on Planet Gammu by a Zoner expedition team. Since its awakening, the unit has raced to evolve itself as much as possible. With the loss of Planet Gammu, Novak had adapted into a being more aware of its surroundings and fighting for its kind. Its ultimate goals are to become a more sophisticated being than it already is, to bring its species into prosperity and to exterminate The Core and anyone attempting to disrupt its course. With adaptations, Novak had established multiple links with multiple bodies, allowing itself to be more efficient and more capable.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Alien SRP ID is used by Unit-9467F, who: </TEXT><PARA/><TRA color="white"/><TEXT> </TEXT><PARA/><TEXT>- Can attack Core ships.</TEXT><PARA/><TEXT>- Can attack any ship to protect allies.</TEXT><PARA/><TEXT>- Can attack any ship, unless in the AI Cruiser.</TEXT><PARA/><TEXT>- Can only engage in self-defense in the AI Cruiser.</TEXT><PARA/><TEXT>- Can only use the AI Drone, AI Bomber, AI Cruiser, and Eagle.</TEXT><PARA/><PARA/><TEXT> </TEXT><PARA/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Omicrons, Omegas, and Sigmas</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack any ship.</TEXT><PARA/><POP/></RDL>

;SRP 45(dsy_license_srp_45)
853190= IKN-Reiwa
853191= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>This "Amaterasu"-class Samura Liner bears identification markers belonging to the Imperial Government of Kusari. Official records label the IKN-Reiwa as the pinnacle of the Imperial Governments diplomatic corps and it is widely seen as an expression of Kusari prowess and ambitions portrayed far beyond Kusari's borders, both as means to intrigue and intimidate those in the regions it visits.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT> This Independent Lawful ID is used by the IKN-Reiwa, a Kusari Government Asset, which: </TEXT><PARA/><TRA color="white"/><TEXT> </TEXT><PARA/><TEXT>- Can attack ships considered hostile by Kusari.</TEXT><PARA/><TEXT>- Can attack non-Kusari intelligence ships.</TEXT><PARA/><TEXT>- Can hire escorts and issue contracts.</TEXT><PARA/><TEXT> </TEXT><PARA/><PARA/><TEXT> </TEXT><PARA/><TRA color="default" bold="true"/><TEXT> </TEXT><TRA bold="default"/><TEXT> </TEXT><TRA bold="true"/><TEXT> </TEXT><PARA/><TRA color="white" bold="default"/><TEXT> </TEXT><PARA/><POP/></RDL>

;SRP 46(dsy_license_srp_46) Battleship Khonsu
853192= Battleship Khonsu
853193= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Khonsu is an Osiris-class battleship that has been dispatched on a long-range mission to the Houses and Borderworlds. The Khonsu's primary purpose is to act as a mobile base and support platform for reconnaissance, research, and anti-Nomad strike operations conducted by the Order and Order allies.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Independent Intelligence ID used by Captain Amanda Ross of the Battleship Khonsu, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack combat ships considered hostile by The Order.</TEXT><PARA/><TEXT>- Can attack Intelligence ships, and ships using Alien equipment.</TEXT><PARA/><TEXT>- Can engage in piracy against ships considered hostile by The Order.</TEXT><PARA/><TEXT>- Can demand Alien and Core equipment and materials.</TEXT><PARA/><TEXT>- Can enforce laws within the Omicrons.</TEXT><PARA/><TEXT>- Cannot leave their Zone of Influence (Rheinland +1, Omicrons, Omegas, Sigmas).</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

;SRP 47(dsy_license_srp_47)
853194= Thallia.Thorn
853195= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>This is an undercover ship belonging to Thallia Thorn, an officer of the Liberty Navy Forty-sixth Fleet. Thorn is a researcher who specializes in computer science and xeno-archeology; interests which take her across all of Sirius and have exposed her to the danger that Aliens and Artificial Intelligence could equally pose.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>Wary of interference to her research and the threat posed by such hazards, Thorn decided that joining a Liberty Navy Fleet of such size would aid in her own security.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>Now under the banner of the Research, Development &amp; Innovation division, coordinating with the Naval Intelligence Division and on-paper assigned to Task Force Akhetaten, Thorn has been granted permission to operate outside the standard Navy operational zones under her own, unique, modus operandi.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Liberty Military official faction SRP ID is used by Thallia Thorn, who:</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>- Can attack ships considered hostile by Liberty.</TEXT><PARA/><TEXT>- Can attack ships that interfere with her research.</TEXT><PARA/><TEXT>- Cannot use Cruisers, Battlecruisers, Battleships, or ships with more than 3,600 cargo space.</TEXT><PARA/><POP/></RDL>

;SRP 48(dsy_license_srp_48)TRCC-JCV-Tarancon
853196= TRCC-JCV-Tarancon 
853197= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>TRCC-JCV-Tarancon is a modified and refurbished battlecruiser crewed largely by disgruntled remnants of Junkers from Omicron Minor. The crew, along with the captain Doidld Tyatsmr, hold resentment against the Core and Order for what they view as a betrayal and abandonment in Minor, and have taken to the borders of civilized space with a more piratical, cutthroat approach to regular Junker business.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT> This Independent Quasilegal SRP ID is used by TRCC-JCV-Tarancon, who: </TEXT><PARA/><TRA color="white"/><TEXT> </TEXT><PARA/><TEXT>- Can attack Hogosha and Xenos.</TEXT><PARA/><TEXT>- Can attack Core and Order combat ships in the Omicrons.</TEXT><PARA/><TEXT>- Can engage in piracy.</TEXT><PARA/><TEXT>- Can attack Core and Order combat ships in the Omicrons.</TEXT><PARA/><TEXT>- Cannot dock in House Space.</TEXT><PARA/><TEXT></TEXT><PARA/><PARA/><TEXT> </TEXT><PARA/><TRA color="default" bold="true"/><TEXT> </TEXT><TRA bold="default"/><TEXT> </TEXT><TRA bold="true"/><TEXT> </TEXT><PARA/><TRA color="white" bold="default"/><TEXT> </TEXT><PARA/><POP/></RDL>

;SRP 49 (dsy_license_srp_49)
853198= Mercenary SRP ID
853199=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TRA bold="true"/><JUST loc="center"/><TEXT>Mercenary</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA bold="default"/><JUST loc="left"/><TEXT> </TEXT><PARA/><TEXT>This Independent Quasilegal SRP ID is used by a mercenary, who:</TEXT><PARA/><TRA color="white"/><TEXT> </TEXT><PARA/><TEXT>- Can attack any ship that is the target of a contract.</TEXT><PARA/><TEXT>- Can only use the Nyx, Steelhead, and Sunbeam.</TEXT><POP/></RDL>


;dsy_license_gd_bh_grp
852655=Bounty Hunters Guild ID
852656=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Bounty Hunters Guild is a well-established mercenary group with roots in the underclasses and ex-cons of Texas. Many of the Guild's best hunters are former pirates themselves, using the knowledge from their past life to hunt down those on the wrong side of the law.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Independent Corporate ID is used by Bounty Hunters, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack any ship to protect Police, Military, or Corporate ships.</TEXT><PARA/><TEXT>- Can attack Unlawful combat ships.</TEXT><PARA/><TEXT>- Can attack any ship that is the target of a contract.</TEXT><PARA/><TEXT>- Can attack other bounty hunting organisations outside of house space targeting the same bounty.</TEXT><PARA/><TEXT>- Cannot use Cruisers, Battlecruisers, Battleships, or ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

;dsy_license_gd_bh_guardian
852763=The Core ID
852764= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Core is a private military company operating mainly within the Edge Worlds. They relentlessly search for Alien Artifacts and technology that can be exploited and sold to wealthy and powerful benefactors in the Houses.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Independent Corporate ID is used by Core pilots, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack Alien, Order, and Technocracy ships, and ships carrying Alien, Order, or Technocracy materials.</TEXT><PARA/><TEXT>- Cannot use any ship with more than 4,300 cargo.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Omicrons +1, Omegas</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships considered hostile by The Core.</TEXT><PARA/><TEXT>- Can engage in piracy, except against House Corporate or Military ships.</TEXT><PARA/><TRA color="default" bold="true"/><TEXT>Outside Zone of Influence:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Must only attack in self-defense while using Cruisers, Battlecruisers, or Battleships.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TEXT>Mining Bonuses: Azurite Gas (3x), Iridium Ore (3x), Xeno Relics (3x)</TEXT><PARA/><TEXT> </TEXT><PARA/><POP/></RDL>

;dsy_license_fc_wild
852723=The Wild
852724=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>Products of Nomad influence and infestation, the so-called "Wild" are Nomad-controlled puppets, infiltrators, and saboteurs. Infiltration and subterfuge is their primary modus operandi, though they are known to engage in overt acts of terrorism in pursuance of the Nomads' inscrutable plans.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Alien SRP ID is used by a Wild infectee, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack any ship.</TEXT><PARA/><TEXT>- Can demand cargo.</TEXT><PARA/><TEXT>- Cannot use Battleships.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

;dsy_license_helghast
852719=Artificial Intelligence ID
852720=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>Mysterious and largely incomprehensible machines, the Gammu AI 'evolved' from automated interstellar probes sent as part of the Sleeper Ship program. Their technology, principles, and goals are almost indecipherable by outsiders, though they largely show no hostile inclination toward mankind.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Alien ID is used by Artificial Intelligence, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack Core ships.</TEXT><PARA/><TEXT>- Can attack any ship carrying AI equipment or materials.</TEXT><PARA/><TEXT>- Cannot use Cruisers other than the AI Cruiser.</TEXT><PARA/><TEXT>- Cannot use Battlecruisers, Battleships, or ships with more than 3,600 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Omegas, Omicrons, Sigmas</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack any ship.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

