853649=Second Division ID
853650=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>Cincinnatus Second Void Division is a scientific and military unit within the Order's structure. Its tasks include exploring systems in the Sirius sector, Uncharted cluster and known anomalies, controlling the exchange of technologies in the Sirius sector, xenoarchaeology, and inventing new technologies for use within the Order and among its partners.</TEXT><PARA/><TEXT></TEXT><PARA/><TEXT>This Independent Intelligence ID is used by a member of the Second Division, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack Combat Ships considered hostile by The Order.</TEXT><PARA/><TEXT>- Can attack Intelligence ships, and ships using Alien equipment.</TEXT><PARA/><TEXT>- Can engage in piracy against ships considered hostile by The Order.</TEXT><PARA/><TEXT>- Can demand Alien and Core equipment and materials.</TEXT><PARA/><TEXT>- Can enforce laws within the Omicrons.</TEXT><PARA/><TEXT></TEXT><PARA/><TRA color="default"/><TEXT>Inside House Space:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Cannot use Cruisers, Battlecruisers, or Battleships, except for the "Resheph" Recon Cruiser.</TEXT><PARA/><TEXT>- "Resheph" Recon Cruisers can only engage Alien ships unless acting in self-defense.</TEXT><PARA/><TEXT></TEXT><PARA/><TRA color="default"/><TEXT>Mining Bonuses: Azurite Gas (3.5x), Iridium Ore (3.5x), Xeno Relics (3.5x)</TEXT><PARA/><TEXT></TEXT><PARA/><POP/></RDL>

