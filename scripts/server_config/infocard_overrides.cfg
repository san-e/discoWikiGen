852601=Interspace Commerce ID
852602=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>Interspace Commerce (IC), one of Liberty's "Big Three", is a banking and insurance corporation best described as the financial juggernaut responsible for the financing and insurance of many of the largest corporate and civilian undertakings in Sirius.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Liberty Corporate ID is used by employees of Interspace Commerce, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack Lane Hackers.</TEXT><PARA/><TEXT>- Can engage in piracy against competitors outside of House Space.</TEXT><PARA/><TEXT>- Cannot use Cruisers, Battlecruisers, or Battleships or ships with more than 3,600 cargo space, except the Renzu Liner.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Systems containing a Sirius Trade Lane</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships considered hostile by Interspace.</TEXT><PARA/><TEXT>- Can attack competitors outside of House Space.</TEXT><PARA/><TEXT>- Can engage in piracy against non-Gallic Corporate ships, except for cargo.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

