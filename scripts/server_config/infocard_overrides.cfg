853212= Nomad Vagrant ID
853213= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Nomad Vagrants are the remnants of those Nomads that were pulled into the Hypergate at the end of the Nomad War. Having returned in small numbers, the Vagrants hope to pave the way for their kin to return to Sirius by any means necessary.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Alien ID is used by Nomad Vagrants, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack any ship to protect allied Alien ships.</TEXT><PARA/><TEXT>- Cannot engage in piracy.</TEXT><PARA/><TEXT>- Cannot leave their Zone of Influence except when alongside a ship carrying an Alien official faction ID.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Omicrons +1, Omegas, Taus, Sigmas, Coronado and systems containing an allied Alien base</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack any ship.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

;Unioners ID (dsy_license_fc_u_grp)
852635= Unioners ID
852636= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Unioners are an outlaw group chiefly comprised of former Rheinland shipyard workers, operating as smugglers and shipbuilders-for-hire on the border between Rheinland and Liberty.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Rheinland Unlawful ID is used by Unioners, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack Imperial Shipping.</TEXT><PARA/><TEXT>- Cannot use Battleships, or ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Rheinland +1, Texas, Zurich, Champagne</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack combat ships.</TEXT><PARA/><TEXT>- Can engage in piracy.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

