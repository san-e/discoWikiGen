853721= [GN]G- Gendarmerie ID
853722= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>Formed after Gallia's reunification, the Gendarmerie serves under the Gallic Naval Combined Fleet as its military law enforcement branch and the Union's only police force. All Gendarmes are enlisted members of the Combined Fleet, responsible for maintaining order, enforcing Union law and protecting Gallic territory, infrastructure and civilian traffic.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Gallic Military Police official faction ID is used by gendarmes of the Gallic Naval Combined Fleet, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Cannot use Cruisers, Battlecruisers, Battleships, or ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Gallia +1</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships considered hostile by Gallia.</TEXT><PARA/><TEXT>- Can enforce laws within Gallia and Zurich.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

