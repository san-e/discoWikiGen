852579= Samura Industries ID
852580= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>Samura is one of two Kusari megacorporations, with a focus on heavy industry and shipbuilding. A company rooted above all else in the tradition and history of the Kusari Empire, Samura goes to great lengths to maintain both their market share and their political standing, often employing the Hogosha syndicates to handle their dirty work from the shadows.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Kusari Corporate ID is used by Samura Industries employees, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack Blood Dragons and Golden Chrysanthemums ships.</TEXT><PARA/><TEXT>- Can engage in piracy against competitors outside of House Space.</TEXT><PARA/><TEXT>- Cannot use Cruisers, Battlecruisers, or Battleships.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Kusari +1, Sigmas, Taus</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships considered hostile by Kusari.</TEXT><PARA/><TEXT>- Can attack competitors outside of Kusari.</TEXT><PARA/><TEXT>- Can engage in piracy against Corporate ships outside of Kusari.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TEXT>Mining Bonuses: Helium-3 (3x), Platinum Ore (3x), Niobium Ore (3x)</TEXT><PARA/><TEXT> </TEXT><PARA/><POP/></RDL>

