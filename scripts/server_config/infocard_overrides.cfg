852612=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>Gateway Shipping is a Bretonian firm that hauls raw materials across the Border and Independent Worlds, catering chiefly to smaller, independent companies. They are partnered with the IMG and ALG, forming a small but hearty alliance of independent corporations in the Omegas.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Bretonian Corporate ID is used by Gateway Shipping employees, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can engage in piracy against competitors outside of House Space.</TEXT><PARA/><TEXT>- Cannot use Cruisers, Battlecruisers, or Battleships.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Bretonia +1, Omegas, Taus</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships considered hostile by Bretonia.</TEXT><PARA/><TEXT>- Can attack competitors outside of Bretonia.</TEXT><PARA/><TEXT>- Can engage in piracy against Corporate ships outside of Bretonia.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

