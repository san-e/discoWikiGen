;531441=GMG| Gas Miners Guild ID
;531442 = <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Gas Miners Guild is a large militarised corporation, considered the sovereign owner of the Sigmas, that focuses on producing and selling H-Fuel. GMG is partnered with Kishiro Technologies and secretly supports the Blood Dragons, Golden Chrysanthemums, Bundschuh and Order.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Independent Corporate official faction ID is used by Gas Miners Guild members, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can engage in piracy against competitors outside of House Space.</TEXT><PARA/><TEXT>- Cannot use Cruisers, Battlecruisers, or Battleships.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Sigmas +1, Kusari +1</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships considered hostile by GMG.</TEXT><PARA/><TEXT>- Can attack competitors outside of House Space.</TEXT><PARA/><TEXT>- Can engage in piracy against Corporate ships outside of House Space.</TEXT><PARA/><TEXT>- Can enforce laws within the Sigmas.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TEXT>Mining Bonuses: Helium-3 (3.5x)</TEXT><PARA/><TEXT> </TEXT><PARA/><POP/></RDL>

