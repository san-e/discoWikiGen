852855=GC- Gen'an Chrysanthemums ID
852856=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Golden Chrysanthemum Gen'an Cell is a radical terrorist faction that seeks to overthrow the Kusari government and establish an authoritarian matriarchy. Cardamine addiction is one of their most defining traits and they use it as a security mechanism against infiltration.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Kusari Unlawful official faction ID is used by members of the Gen'an Chrysanthemums, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack Kishiro, Samura, Hogosha, and Farmers Alliance.</TEXT><PARA/><TEXT>- Can attack ships carrying Artifacts or Stabiline.</TEXT><PARA/><TEXT>- Cannot use Cruisers, except GC-Akechi-kan, GC-Murasaki-kan, and GC-Kakumei.</TEXT><PARA/><TEXT>- Cannot use Battlecruisers, Battleships, or ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Kusari +1, Sigmas, Colorado, Tau-37</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack combat ships.</TEXT><PARA/><TEXT>- Can engage in piracy.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

; dsy_license_pf_17_grp
852857=The Republican Provisional Assembly ID
852858= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Republican Provisional Assembly (RPA) is a proto-governmental faction of Mollys of various - often competing - ideologies and origins, with a focus on upholding the quality of life of the civilian members of the Molly movement. Their goal is either establishing a stable and independent Molly State, or overthrowing the Bretonian Crown and instating a Republic in its place. They often attack BMM and Corsair vessels on sight, but otherwise are usually more pragmatic than violent.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Bretonian Unlawful official faction ID is used by Mollys of the Republican Provisional Assembly, who:</TEXT><PARA/><TRA color="white"/><TEXT> </TEXT><PARA/><TEXT>- Can attack BMM.</TEXT><PARA/><TEXT>- Cannot use Battleships or ships with more than 4300 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Bretonia, Dublin, +1</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack Combat Ships.</TEXT><PARA/><TEXT>- Can engage in piracy.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TEXT>Mining Bonuses: Gold Ore (3.5x)</TEXT><PARA/><TEXT> </TEXT><PARA/><POP/></RDL>

; dsy_license_pf_18_grp
852859=Buro des Marinenachrichtendiensts ID
852860=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TRA data="1" mask="1" def="-2"/><JUST loc="center"/><TEXT>Marinenachrichtendienst ID</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA data="0" mask="1" def="-1"/><JUST loc="left"/><TEXT>The "Buro des Marinenachrichtendiensts" (Bureau of naval intelligence), short "BDM" or "Buro", is Rheinland's secret service and head of the Marinenachrichtendienst, tasked with Sirius-wide monitoring, gathering and processing of information, prevention of hostile acts, and neutralization of the alien menace in Rheinland. The BDM relies on a variety of measures, the majority of which are clandestine. If necessary, they even use ties to the criminal underground in order to accomplish their mission.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Rheinland Intelligence official faction ID is used by operatives of the BDM, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack combat ships considered hostile by Rheinland.</TEXT><PARA/><TEXT>- Can attack GMG combat ships within the Sigmas.</TEXT><PARA/><TEXT>- Can engage in piracy against ships considered hostile by Rheinland.</TEXT><PARA/><TEXT>- Can attack Intelligence ships.</TEXT><PARA/><TEXT>- Can demand Alien equipment and materials.</TEXT><PARA/><TEXT>- Cannot use Battleships, or ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Rheinland +1, Zurich</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships considered hostile by Rheinland.</TEXT><PARA/><TEXT>- Can enforce laws within Rheinland, Dresden and Cologne.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TEXT>Outside Zone of Influence:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Must only attack in self-defense while using Cruisers or Battlecruisers.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

; dsy_license_ga_idf_grp
852775=Ile-de-France Shipping ID
852776=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>Ile-de-France Shipping (IDF) is the premier Gallic shipping corporation, at one time responsible for the vast majority of shipping within the Kingdom. With the monarchy's collapse and introduction of foreign trade, IDF has struggled to adapt, all while being targeted by anti-royalist politicians who consider them complicit in the former government's crimes.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Gallic Corporate ID is used by IDF Shipping employees, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can engage in piracy against competitors outside of House Space.</TEXT><PARA/><TEXT>- Cannot use Cruisers, Battlecruisers, or Battleships.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Gallia +1, Taus, Rheinland +1</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships considered hostile by Gallia.</TEXT><PARA/><TEXT>- Can attack competitors outside of House Space.</TEXT><PARA/><TEXT>- Can engage in piracy against Corporate ships outside of House Space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

; dsy_license_ga_efl_grp
852773=EFL Oil and Machinery ID
852774=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>EFL Oil and Machinery is a Gallic industrial corporation which focuses on fuel production, heavy industry and shipbuilding. They are the principal architects of Gallia's Trade Lane and Jump Gate network, and are now focused on exporting those services to Sirius.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Gallic Corporate ID is used by EFL Oil and Machinery employees, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can demand Gallic and Ageira Gate / Lane parts.</TEXT><PARA/><TEXT>- Can engage in piracy against competitors outside of House Space.</TEXT><PARA/><TEXT>- Cannot use Cruisers, Battlecruisers, or Battleships.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Gallia +1, Taus, Rheinland +1</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships considered hostile by Gallia.</TEXT><PARA/><TEXT>- Can attack competitors outside of House Space.</TEXT><PARA/><TEXT>- Can engage in piracy against Corporate ships outside of House Space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

; dsy_license_ga_gms_grp
852771=Gallic Metal Service ID
852772= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Gallic Metal Service is a Gallic megacorporation focusing on mining and manufacturing. They currently hold a near-total monopoly on the Gallic mining industry, from planetside excavation to deep space prospecting, as well as an ever-growing share of domestic shipping, directly cutting into IDF's market share.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Gallic Corporate ID is used by Gallic Metal Service employees, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can engage in piracy against competitors outside of House Space.</TEXT><PARA/><TEXT>- Cannot use Cruisers, Battlecruisers, or Battleships.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Gallia +1, Taus, Cologne</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships considered hostile by Gallia.</TEXT><PARA/><TEXT>- Can attack competitors outside of Gallia.</TEXT><PARA/><TEXT>- Can engage in piracy against Corporate ships outside of Gallia.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TEXT>Mining Bonuses: Molybdenum Ore (3x), Niobium Ore (3x)</TEXT><PARA/><TEXT> </TEXT><PARA/><POP/></RDL>

; dsy_license_pf_19_grp
852861=Med Force Enterprises
852862=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>Med Force Enterprises is a distinguished collective of medical specialists and scientific researchers spread across the regions of Sirius and Gallia. Originally established as Zoners, our members soon realized that their noble work set them apart even from their fellow Zoners. It is important to note that MFE operates as a not-for-profit organization.</TEXT><PARA/><TEXT>The extensive knowledge, unwavering dedication, and exceptional expertise possessed by our members have garnered significant recognition and demand from various individuals, houses, and groups. Adhering to the principles of the Hippocratic Oath, MFE places great emphasis on avoiding conflicts whenever possible. Our primary objective is to solemnly preserve lives, provide assistance to those in need, and educate those who seek medical enlightenment.</TEXT><PARA/><PARA/><TEXT>This Independent Quasilegal ID is used by members of Med Force Enterprises, who:</TEXT><PARA/><TRA color="white"/><PARA/><TEXT>- Cannot use Cruisers, Battlecruisers, or Battleships.</TEXT><PARA/><TEXT>- Cannot use ships with more than 3,600 cargo space in House space, except Liners.</TEXT><PARA/><TEXT>- May only attack in self-defense, or to protect an allied ship.</TEXT><PARA/><POP/></RDL>

; dsy_license_fc_brigands_grp
852781=Gallic Brigands
852782=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Gallic Brigands are a large, loosely affiliated union of space pirates, smugglers, and fences operating within and throughout Gallia.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Gallic Unlawful ID is used by Gallic Brigands, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Cannot use Cruisers, Battlecruisers, Battleships, or ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Gallia +1, Taus +1, Cologne</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack combat ships.</TEXT><PARA/><TEXT>- Can engage in piracy.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

