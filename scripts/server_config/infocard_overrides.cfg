853709= [GN] Combined Fleet ID
853710=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>Formed after reunification, the Gallic Naval Combined Fleet brings the Union's naval forces and supporting services under a single command. It defends Gallic territory, protects strategic routes and infrastructure, and supports the enforcement of Union law.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Gallic Military official faction ID is used by Gallic Naval Combined Fleet servicemembers, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack Bretonian and Kusari combat ships in the Taus.</TEXT><PARA/><TEXT>- Cannot use ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Gallia +1, Cologne, Tau-29, Tau-31</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships considered hostile by Gallia.</TEXT><PARA/><TEXT>- Can attack Outcasts in the Taus.</TEXT><PARA/><TEXT>- Can enforce laws within Gallia and Zurich.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

;dsy_license_pf_64_grp
853713=UC/- The Unione Corse ID
853714=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Unione Corse is a highly organized and secretive syndicate of Gallic crime families focused on the control and supplying of the Gallic Black Market. While it performs mercenary work for both lawful and unlawful groups, they generally do not attack targets inside Gallia, though "accidents" happen. The Unione Corse is also rumored to control the distribution and the production of the narcotic Nox.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Gallic Quasilegal ID is used by members of the Unione Corse, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack any ship that is carrying Cardamine.</TEXT><PARA/><TEXT>- Can attack any ship that is the target of a contract.</TEXT><PARA/><TEXT>- Can attack other bounty hunting organisations outside of house space targeting the same bounty.</TEXT><PARA/><TEXT>- Cannot use Cruisers, Battlecruisers, Battleships, or ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Gallia +1, Taus</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can engage in piracy.</TEXT><PARA/><TEXT>- Can enforce laws within Provence.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

;dsy_license_fc_c_grp
852613= Corsairs ID
852614= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>Considered by many to be the largest criminal organization in Sirius, the Corsairs are a quasi-nation of raiders and pirates, targeting civilian and military targets with reckless abandon as they plunder the border worlds. They frequently clash with the Outcasts for territory in the Edge Worlds, while continuing a bloody battle with the Hessians and allies for the resource-rich Omegas.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Independent Unlawful ID is used by Corsairs, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack any ship carrying Hessian Tears or Cardamine.</TEXT><PARA/><TEXT>- Can attack any hostile ship in Omicron Gamma</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Bretonia, Kusari, Omegas, Omicrons, Rheinland, Sigmas, Dublin</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack combat ships.</TEXT><PARA/><TEXT>- Can engage in piracy.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TEXT>Mining Bonuses: Xeno Relics (3x), Gold Ore (3x)</TEXT><PARA/><TEXT> </TEXT><PARA/><POP/></RDL>

