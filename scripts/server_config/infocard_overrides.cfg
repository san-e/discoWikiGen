852571=Kusari Naval Forces ID
852572=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Kusari Naval Forces are the highly organized and technologically advanced military elements of the Empire of Kusari. Despite being rooted in strict tradition and unflinching hierarchy, the KNF nevertheless continues to innovate due in no small part to the considerable advantages of Kusari industry.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Kusari Military ID is used by Kusari Naval Forces servicemembers, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack Gallic combat ships within the Taus.</TEXT><PARA/><TEXT>- Cannot use ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Kusari +1,Liberty, Tau-31</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships considered hostile by Kusari.</TEXT><PARA/><TEXT>- Can attack Liberty combat ships.</TEXT><PARA/><TEXT>- Can demand Optronics and Quantum Multiplexors in Galileo and Kepler.</TEXT><PARA/><TEXT>- Can enforce laws within Kusari and Tohoku.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

