853697= DTR- The Deterrence ID
853698= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Deterrence are a quasi-military Corsair faction operating from the remote Edge Worlds of Sirius. Originating from Planet Crete in Omicron Gamma - they have quickly risen to be a influential organization in their own right. Following the teachings and guidance of their enigmatic leader, the group now holds a significant military presence and commands a large fleet of sizable power.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Independent Unlawful official faction ID is used by members of the Deterrence, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack any ship carrying Hessian Tears or Cardamine.</TEXT><PARA/><TEXT>- Can attack any hostile ship in Omicron Gamma</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within their Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Bretonia, Kusari, Omegas, Omicrons, Rheinland, Sigmas, Dublin</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack combat ships.</TEXT><PARA/><TEXT>- Can engage in piracy.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TEXT>Mining Bonuses: Xeno Relics (3.5x), Gold Ore (3.5x)</TEXT><PARA/><TEXT> </TEXT><PARA/><POP/></RDL>

