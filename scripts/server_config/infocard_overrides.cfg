853679=AWES- All Worlds Enterprises and Securities ID
853680=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>All Worlds Enterprises and Securities is an Interspace Commerce Corporation with Liberty base values, but strong Freelance influences. Their goals are to invest in and support commercial interests throughout Sirius with logistics coordination, insurance benefits, and escort incentives. They are rumored to have dealings with the Red Hessians and Golden Chrysanthemums.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Liberty Corporate official faction ID is used by All Worlds Enterprises and Securities employees, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack Lane Hackers.</TEXT><PARA/><TEXT>- Can engage in piracy against competitors outside of House Space.</TEXT><PARA/><TEXT>- Cannot use Cruisers, Battlecruisers, or Battleships.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Systems containing a Sirius Trade Lane</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships considered hostile by Interspace.</TEXT><PARA/><TEXT>- Can attack competitors outside of House Space.</TEXT><PARA/><TEXT>- Can demand credits from Corporate ships outside of House Space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

