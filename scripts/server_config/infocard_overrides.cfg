852777=Maquis ID
852778=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Maquis are anti-Royalist terrorists dedicated to the complete eradication of Gallia's nobility by any means necessary.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Gallic Unlawful ID is used by Maquisards, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Cannot use Battleships, or ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Gallia +1, Taus, Cologne</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack any ship.</TEXT><PARA/><TEXT>- Can demand cargo.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

