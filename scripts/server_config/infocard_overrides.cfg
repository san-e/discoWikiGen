787203=Lend Lease Materiel
787204=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TRA data="1" mask="1" def="-2"/><JUST loc="center"/><TEXT>LEND LEASE MATERIEL</TEXT><PARA/><TRA data="0" mask="1" def="-1"/><TRA color="default" bold="default"/><JUST loc="left"/><TEXT></TEXT><PARA/><TEXT>During the Gallic War, Liberty provided vast amounts of financial, military, and logistical support to Bretonia. In addition to capital ships, this included the plant machinery and specialist tooling to maintain and repair them. Following the return of loaned ships, Liberty has requested Bretonia return this specialist equipment to aid with its own fleet readiness and reactivation efforts.</TEXT><PARA/><POP/></RDL>

