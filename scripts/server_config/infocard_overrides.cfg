852615= Outcasts ID
852616= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The enigmatic Outcasts are the principal producers and suppliers of the drug Cardamine throughout the Sirius sector. While they routinely clash with their Corsair brethren over territory in the edge worlds, their primary goal is the sector-wide distribution of Cardamine.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Independent Unlawful ID is used by Outcasts, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack any ship carrying Artifacts, Stabiline or Nox.</TEXT><PARA/><TEXT>- Can attack any hostile ship in Omicron Alpha</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Bretonia, Kusari, Liberty, Omicrons, Sigmas, Taus, Coronado, Cortez, Galileo, Inverness, Kepler, Languedoc, Magellan, Ontario</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack combat ships.</TEXT><PARA/><TEXT>- Can engage in piracy.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TEXT>Mining Bonuses: Xeno Relics (3x), Niobium Ore (3x)</TEXT><PARA/><TEXT> </TEXT><PARA/><POP/></RDL>

