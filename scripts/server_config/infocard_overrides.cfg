853735= Halpert Kennedy
853736=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>Having been hired in 828 AS, Halpert Kennedy is one of the more well known Starfliers pilots. Considering he's flown through the majority of what the Sirius Sector has to offer, his ship has suffered damage of all kinds throughout his career as a cartographer. His willingness to learn the more remote and dangerous locations in space is matched only by his bad attitude. Despite his unfavorable conduct, the Starfliers elect to keep him on board due to his excellent work record.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT> This Independent SRP ID is used by Halpert Kennedy, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Cannot mount weapons.</TEXT><PARA/><TEXT>- Cannot fulfill bounty contracts.</TEXT><PARA/><TEXT>- Can only fly the Kali Light Fighter.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

