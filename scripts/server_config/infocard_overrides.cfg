; Rule Commodity Update
786604=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TRA color="default" bold="true"/><JUST loc="center"/><TEXT>General Conduct:</TEXT><PARA/><TEXT></TEXT><PARA/><JUST loc="left"/><TEXT>1.0 - Don't be a dick. It's a game, try to keep it fun for everyone playing it. Behavior that falls within the technical letter of the rules but not the spirit won't be tolerated.</TEXT><PARA/><TEXT></TEXT><PARA/><TEXT>1.1 - Discovery is an English-language roleplaying server. Communication in-game and in the roleplaying areas of the forums must be in-character and appropriate for Discovery Freelancer's setting. Metagaming and powergaming are strictly forbidden.</TEXT><PARA/><TEXT></TEXT><PARA/><TEXT>1.2 - Cheating or exploiting game mechanics is not allowed. This can include 'multiboxing' (logging in with multiple characters at the same time), disconnecting during player encounters (post here if you disconnect by accident), abusing bugs, etc.</TEXT><PARA/><TEXT></TEXT><PARA/><TEXT></TEXT><PARA/><TRA color="default" bold="true"/><JUST loc="center"/><TEXT>ID and Combat Rules:</TEXT><PARA/><TEXT></TEXT><PARA/><JUST loc="left"/><TEXT>2.0 - Every ship must have one ID equipped, and play in a way that represents the role of that ID. Your ID explains what you can do and where. Some IDs have a 'Zone of Influence' (ZOI) where extra actions are permitted. All IDs have a ZOI in systems containing an NPC station of the same affiliation.</TEXT><PARA/><TEXT></TEXT><PARA/><TEXT>2.1 - You must provide sufficient roleplay before attacking another player, and give them enough time to react. This means at least two messages and 10 seconds delay before attacking.</TEXT><PARA/><TEXT></TEXT><PARA/><TEXT>2.2 - If you are killed or dock during a hostile player encounter, you must not re-enter the system or attack anyone involved in the encounter for 1 hour. Trade Ships docking during a hostile player encounter are not considered to have been "killed".</TEXT><PARA/><TEXT></TEXT><PARA/><TEXT>2.3- All IDs can: </TEXT><PARA/><TEXT>Attack Alien IDs.</TEXT><PARA/><TEXT>Attack any ship to defend Allies, except while flying Cruisers, Battlecruisers, or Battleships.</TEXT><PARA/><TEXT></TEXT><PARA/><TEXT>Within their ZOI:</TEXT><PARA/><TEXT>Attack any ship to defend Allies.</TEXT><PARA/><TEXT></TEXT><PARA/><TEXT>Within Uncharted Systems:</TEXT><PARA/><TEXT>Act as if the system were in their Zone of Influence.</TEXT><PARA/><TEXT>Demand Cerulite Crystals, Chirodebris, Cryo-Organisms, and Organic Capacitors from non-Allies.</TEXT><PARA/><TEXT></TEXT><PARA/><TEXT>2.4 - Terms used in IDs:</TEXT><PARA/><TEXT>"Allies" - Ships of the same non-Generic affiliation or ID, Ships defined as your ID's allies on the in-game faction rep sheet, or Ships you are currently flying in group with.</TEXT><PARA/><TEXT>"Trade Ship" - Transports, Liners, and Frigates.</TEXT><PARA/><TEXT>"Combat Ship" - Ships other than Trade Ships, or Trade Ships used offensively.</TEXT><PARA/><TEXT>"Contract" - An agreement for a service, such as combat or escort, in exchange for some form of payment.</TEXT><PARA/><TEXT>"Alien Materials" - Artifacts, Low-Grade Artifacts, Xeno Relics, Nomad Power Cells, Nomad Remains, Azurite Gas, Cerulite Crystals, Chirodebris, Cryo-Organisms, and Organic Capacitors.</TEXT><PARA/><TEXT>"Piracy" - a reasonable demand issued to a ship which can be attacked if it fails to comply. Piracy can include requests for credits and cargo or a roleplay requirement, such as following a instruction or answering a question.</TEXT><PARA/><TEXT></TEXT><PARA/><TEXT></TEXT><PARA/><TRA color="default" bold="true"/><JUST loc="center"/><TEXT>Player Owned Bases Rules:</TEXT><PARA/><TEXT></TEXT><PARA/><JUST loc="left"/><TEXT>3.0 - General rules:</TEXT><PARA/><TEXT>Base construction guides can be found here.</TEXT><PARA/><TEXT>Base construction must be in accord with the roleplay of the builder's ID. Siege Declarations must be in accord with the roleplay of the attacker's ID.</TEXT><PARA/><TEXT>When a Siege Declaration is posted, players must wait 24 hours before the Declaration is considered live and the base is able to be attacked.</TEXT><PARA/><TEXT>Siege Declarations last for two weeks once active. Once a Siege Declaration expires, the base may not be subject to another Siege Declaration for four weeks.</TEXT><PARA/><TEXT>POBs built in House Space are subject to House laws and fees.</TEXT><PARA/><TEXT>POB location and affiliation are permanent and alterations will be considered on a case-by-case basis.</TEXT><PARA/><TEXT></TEXT><PARA/><TEXT>3.1 - Bases may only be attacked by IDs that have in-roleplay justification and appropriate ID lines for the attack. Core 2 bases and higher require roleplay documented on the forum prior to the siege declaration being posted.</TEXT><PARA/><TEXT></TEXT><PARA/><TEXT>3.2 - You can apply for your base to be upgraded to Core 4 after 2 months at Core 3 and demonstrating productive base roleplay. Once approved the base will receive the blueprints required to upgrade the base.</TEXT><PARA/><TEXT></TEXT><PARA/><TEXT>3.3 - Official Factions can apply for their base to be upgraded to Core 5 after 3 months at Core 4 and demonstrating productive base roleplay. Once approved the base will receive the blueprints required to upgrade the base.</TEXT><PARA/><TEXT>With the upgrade to Core 5, wear and tear damage on the base will be disabled. Only one Core 5 base per Official Faction is permitted. If this status is lost, the Core 5 upgrade will be downgraded to Core 4.</TEXT><PARA/><TEXT></TEXT><PARA/><TEXT></TEXT><PARA/><TRA color="default" bold="true"/><JUST loc="center"/><TEXT>System Classifications:</TEXT><PARA/><TEXT></TEXT><PARA/><JUST loc="left"/><TEXT>4.0 - For ZOI rules, systems are classified as:</TEXT><PARA/><TEXT></TEXT><PARA/><TEXT>Liberty</TEXT><PARA/><TEXT>House Space: New York*, Alaska, California, Colorado, Pennsylvania, Texas.</TEXT><PARA/><TEXT></TEXT><PARA/><TEXT>Bretonia</TEXT><PARA/><TEXT>House Space: New London*, Cambridge, Leeds, Manchester, Newcastle.</TEXT><PARA/><TEXT></TEXT><PARA/><TEXT>Rheinland</TEXT><PARA/><TEXT>House Space: New Berlin*, Frankfurt, Hamburg, Stuttgart, Thuringia.</TEXT><PARA/><TEXT></TEXT><PARA/><TEXT>Kusari</TEXT><PARA/><TEXT>House Space: New Tokyo*, Hokkaido, Honshu, Kyushu, Shikoku.</TEXT><PARA/><TEXT></TEXT><PARA/><TEXT>Gallia</TEXT><PARA/><TEXT>House Space: Ile-de-France*, Burgundy, Champagne, Languedoc, Orleanais, Picardy.</TEXT><PARA/><TEXT></TEXT><PARA/><TEXT>* - House Capital System</TEXT><PARA/><TEXT></TEXT><PARA/><TEXT>Independent Worlds</TEXT><PARA/><TEXT></TEXT><PARA/><TEXT>Omegas: Dresden, Omega-11, Omega-3, Omega-41, Omega-48, Omega-5, Omega-52, Omega-7.</TEXT><PARA/><TEXT></TEXT><PARA/><TEXT>Omicrons: Omicron Alpha, Omicron Beta, Omicron Delta, Omicron Gamma, Omicron Iota, Omicron Kappa, Omicron Minor, Omicron Major, Omicron Pi, Omicron Psi, Omicron Theta, Omicron Zeta.</TEXT><PARA/><TEXT></TEXT><PARA/><TEXT>Sigmas: Sigma-13, Sigma-15, Sigma-17, Sigma-19, Sigma-59, Tohoku.</TEXT><PARA/><TEXT></TEXT><PARA/><TEXT>Taus: Baffin, Edinburgh, Roussillon, Tau-23, Tau-29, Tau-31, Tau-37, Tau-44, Tau-61.</TEXT><PARA/><TEXT></TEXT><PARA/><TEXT>Other independent: Bering, Chugoku, Cologne, Copernicus, Cortez, Coronado, Dublin, Galileo, Hudson, Inverness, Kansas, Kepler, Magellan, Ontario, Provence, Unknown, Vespucci, Zurich.</TEXT><PARA/><TEXT></TEXT><PARA/><TEXT>Uncharted: Uncharted 1-10, Earhart.</TEXT><POP/></RDL>

; Welcome To Discovery conversion to Newbie Manual
786588=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TRA bold="true"/><JUST loc="center"/><TEXT>The Pilot's Guidebook</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA bold="default" italic="true"/><JUST loc="left"/><TEXT>*The text in this commodity should be viewed as out of roleplay information.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA italic="default"/><TEXT>Welcome to the Discovery Freelancer RP 24/7 server. This is a simple guide to help you get started on your path to discovering the Sirius sector. You can find more in-depth tutorials on our wiki at www.discoverygc.com/wiki2/</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>1. - Your starter Kestrel is equipped with a Mining Array, which allows you to mine resources to sell for profit. Helium can be found by following the trail of buoys to the right of this beacon. Press &quot;2&quot; to switch to a new weapon group and activate your mining laser by clicking on it. Once you’re in the asteroid field, near the Mineable Zone beacon, you should see small floating rocks - if you shoot them with your mining laser, you will receive Helium in your cargo hold.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>2. - The other side of the mining coin is trading; if you have a full load of Helium, you can select it in your inventory with F7 and select &quot;Show Routes&quot; to see where it sells best, from stations you’ve been to. Neon, purchased from Planet Erie, has the same routes albeit at a lower profit. Both can be taken to Helgoland Station in Sigma-13 for a good first trade run.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>3. - You may also take missions to make quick money. The mission price rises with their difficulty and in addition to the money of the mission itself, you can also sell the pilots to Harrisburg Station, which will pay you the bounty on them. Avoid taking missions that are beyond level 1 or 2 when starting out, as the mission AI difficulty ramps up quickly.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>4.- Your short term goal is to obtain a character you can make money on and fund all of your other characters with. When you have gotten a trading or mining ship, use the command &quot;/set cashcode 1234&quot; where 1234 is your desired password. Once you do this, you can draw cash from this character to any other character by using the command &quot;/drawcash CHARACTERNAME PASSWORD AMOUNT&quot;. You can also transfer money from your character to another by using the command &quot;/givecash CHARACTER AMOUNT&quot;</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>5. - Make money, make friends, and don&apos;t be afraid to ask for help from other players in-game, on the forums, or on Discord.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>Good luck, pilot.</TEXT><PARA/><TEXT> </TEXT><PARA/><POP/></RDL>

; Meles infocard - Class limit warning
722514=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TRA data="1" mask="1" def="-2"/><JUST loc="center"/><TEXT>"MELES" Particle Turret</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="red" bold="true" /><TEXT>The MELES Turret is ONLY usable on Freighters.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default" bold="default"/><JUST loc="left"/><TEXT>MELES is a powerful particle turret weapon developed by Bowex for their famous Clydesdale squads in the teens of the 8th century. The design is similar to particle weapons used by the Armed Forces and the civilian weapons of the house, but overcharged massively for veteran pilots to exploit the greater power potential of their freighters. While some saw experimental deployment during the conflict with Gallia, the weapon's difficult handling with its slow firing rate, low range, and massive energy consumption led Bowex to scrap it. In the design's brief existence, its licensure to other companies caused some examples to leak out onto the open markets, although only expert freighter pilots can really appreciate its potential.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA data="1" mask="1" def="-2"/><JUST loc="center"/><TEXT>Shield Damage Modifiers</TEXT><PARA/><TRA data="0" mask="1" def="-1"/><TEXT> </TEXT><PARA/><JUST loc="left"/><TEXT>Graviton: 110%</TEXT><PARA/><TEXT>Molecular: 75%</TEXT><PARA/><TEXT>Positron: 90%</TEXT><PARA/><PARA/><POP/></RDL>

; Battleship Scanner infocard - Class limit warning
852746=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TRA data="1" mask="1" def="-2"/><JUST loc="center"/><TEXT>Battleship Scanner</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA data="0" mask="1" def="-1"/><JUST loc="left"/><TEXT>The Battleship Scanner requires vast amounts of energy to operate and is often installed in the largest military ships. It provides the best detection performance and range of all scanners in Sirius.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT> Range: 19000m</TEXT><PARA/><TEXT> Cargo Scan Range: 9500m</TEXT><PARA/><PARA/><POP/></RDL>

;====== IDs ======
;dsy_license_freelancer - Freelancer ID
852657=Freelancer ID
852658= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>Freelancers are people not affiliated with any faction in particular. They generally operate independent trade ships or snubcraft, taking the odd job here or there to pay for fuel and supplies.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Generic ID is used by Freelancers, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack all other bounty hunters targeting the same bounty.</TEXT><PARA/><TEXT>- Can attack any ship that is the target of a contract.</TEXT><PARA/><TEXT>- Cannot use Cruisers, Battlecruisers, Battleships, or ships with more than 3,600 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TEXT>Mining Bonuses: Heavy Water (3x)</TEXT><PARA/><TEXT> </TEXT><PARA/><POP/></RDL>

;dsy_license_smuggler - Smuggler ID
852747=Smuggler ID
852748=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>Smugglers are traders who deal in illicit goods or illegally cross embargo lines. The occupation is a dangerous one, as they may find themselves targets of both law enforcement and pirates, but the demand for drugs, weaponry, or exotic alien materials promises great rewards to the daredevil pilots who are willing to take the risks.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Generic ID is used by Smugglers, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can only use Trade ships.</TEXT><PARA/><TEXT>- Can only haul commodities defined as contraband in House laws.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>


;dsy_license_pirate
852701=Pirate ID
852702=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>Independent Pirates are unaffiliated unlawfuls with little interest in sharing their profits. Usually regarded negatively by organized crime groups due to their unwillingness to share their illicit gains, some pirates manage to find a suitable arrangement with their more organised brethren.</TEXT><PARA/><PARA/><TEXT>This Generic ID is used by independent Pirates, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can engage in piracy against trade ships.</TEXT><PARA/><TEXT>- Can engage in piracy against combat ships outside of House Space.</TEXT><PARA/><TEXT>- Can attack any ship in pursuit of an Unlawful contract.</TEXT><PARA/><TEXT>- Cannot use Cruisers, Battlecruisers, Battleships, or ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

