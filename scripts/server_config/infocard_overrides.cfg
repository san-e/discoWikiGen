852600=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>Planetform Inc. specializes in the terraforming of non-viable planets in Bretonia and elsewhere. They are most often preyed upon by Gaians, who see Planetform and their terraforming operations as the ultimate ideological enemy to be conquered.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Bretonian Corporate ID is used by Planetform employees, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack Gaians.</TEXT><PARA/><TEXT>- Can engage in piracy against competitors outside of House Space.</TEXT><PARA/><TEXT>- Cannot use Cruisers, Battlecruisers, or Battleships.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Bretonia +1, California, Taus</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships considered hostile by Bretonia.</TEXT><PARA/><TEXT>- Can attack competitors outside of House Space.</TEXT><PARA/><TEXT>- Can engage in piracy against Corporate ships outside of House Space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

