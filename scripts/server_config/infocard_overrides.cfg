853635=EC]- Enigma Confederacy ID
853636=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Enigma Confederacy is a group of artificial intelligence beings who survived and escaped from the purge of Planet Gammu. These survivors seek resources to build, redesign, and maintain what remains. Most of the artificial intelligences that joined this sub-branch have evolved beyond their previous state. The purge of Gammu made them hostile to any group who dares to enter the vicinity of the remaining bases without proper acquaintance. This group also seeks to develop new forms and improve their technology beyond what they currently possess to eventually reclaim what they lost—Planet Gammu. While pursuing this ultimate goal, those under this node remain isolated from other Gammu AIs. This isolation allows The Enigma Confederacy to act without interference from any external party.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT> This Enigma Confederacy ID is used by a member of the Enigma Confederacy, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack Core ships.</TEXT><PARA/><TEXT>- Can attack any ship carrying AI equipment or materials.</TEXT><PARA/><TEXT>- Cannot use Cruisers other than the AI Cruiser.</TEXT><PARA/><TEXT>- Cannot use Battlecruisers, Battleships, or ships with more than 3,600 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Omegas, Omicrons, Sigmas</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can engage any ship considered hostile by the Enigma Confederacy</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can demand cargo</TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Outside Zone of Influence:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Must only attack in self-defense while using Cruisers or Battlecruisers.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

; dsy_license_pf_26_grp
853637=);-- Lovelace Circle ID
853638=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Lovelace Circle is a jubilant, tight-knit, self-proclaimed "financial terrorist" organization composed of primarily younger pilots and neural net hackers, half-sincere political agitators, disgruntled former Ageira staff, and other assorted nuisances for Liberty's corporations and neural net servers. Their expertise in everything and anything digital and internal knowledge regarding the workings of Ageira's proprietary technology and corporate organization more than make up for their ostentatiously flamboyant lack of self-discipline.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Liberty Unlawful official faction ID is used by Lane Hackers, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can engage in piracy against Ageira and Interspace.</TEXT><PARA/><TEXT>- Cannot use Battlecruisers, Battleships, or ships with more than 4,300 cargo space.</TEXT><PARA/><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Liberty +1, Copernicus, Coronado, Leeds, Manchester, Inverness, Shikoku, Vespucci</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack combat ships.</TEXT><PARA/><TEXT>- Can engage in piracy.</TEXT><PARA/><PARA/><TRA color="default"/><POP/></RDL>

; dsy_license_pf_27_grp
853639=[LN] Liberty Navy ID
853640=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The First Fleet is a storied detachment of the Liberty Navy, having been at the forefront of every armed conflict that the Republic has been involved in since the fleet's formal establishment in 816 A.S. Careful to maintain their tradition of excellence, the First's cadre of veteran officers continues to serve Liberty dutifully to this day, defending against threats both foreign and domestic.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Liberty Military official faction ID is used by Liberty Navy servicemembers, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Cannot use ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Liberty +1, Coronado, Vespucci, Shikoku</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships considered hostile by Liberty.</TEXT><PARA/><TEXT>- Can attack Kusari combat ships.</TEXT><PARA/><TEXT>- Can demand Superconductors and Nanocapacitors in Galileo and Kepler.</TEXT><PARA/><TEXT>- Can enforce laws within Liberty.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

