852605=Cryer Pharmaceuticals ID
852606=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>Cryer Pharmaceuticals is the Liberty bio-medical corporation that developed Stabiline, an expensive synthetic pharmaceutical that staves off the effects of Cardamine withdrawal. High demand for the drug, combined with the Outcasts' obvious desire to destroy it, have left Cryer facilities and personnel under constant threat.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Liberty Corporate ID is used by Cryer Pharmaceuticals employees, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack Gaians, Golden Chrysanthemums, Lane Hackers, Liberty Rogues, and Outcasts.</TEXT><PARA/><TEXT>- Can demand Cardamine.</TEXT><PARA/><TEXT>- Cannot use Cruisers, Battlecruisers, or Battleships.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Liberty +1, Sigmas and bordering Omicrons, Cambridge</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships considered hostile by Liberty.</TEXT><PARA/><TEXT>- Can engage in piracy against Corporate ships outside of House Space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

