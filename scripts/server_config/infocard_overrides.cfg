852637=Golden Chrysanthemums ID
852638=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Golden Chrysanthemums are a terrorist organization seeking to the overthrow the Kusari government and institute a matriarchy. To that end they have forged alliances with the Blood Dragons - who also wish to upend Kusarian society - and the Outcasts, who obviously oppose the Corsair influence in Kusari.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Kusari Unlawful ID is used by members of the Golden Chrysanthemums, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack Kishiro, Samura, Hogosha, and Farmers Alliance.</TEXT><PARA/><TEXT>- Can attack ships carrying Artifacts or Stabiline.</TEXT><PARA/><TEXT>- Cannot use Cruisers, Battlecruisers, Battleships, or ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Kusari +1, Sigmas</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack combat ships.</TEXT><PARA/><TEXT>- Can engage in piracy.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

