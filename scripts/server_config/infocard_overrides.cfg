853017= Aegis Destroyer ID
853018= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Bounty Hunters Guild is a well-established mercenary group with roots in the underclasses and ex-cons of Texas. Many of the Guild's best hunters are former pirates themselves, using the knowledge from their past life to hunt down those on the wrong side of the law.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Independent Corporate ID is used by Bounty Hunters, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack any ship to protect Police, Military, or Corporate ships.</TEXT><PARA/><TEXT>- Can attack Unlawful combat ships.</TEXT><PARA/><TEXT>- Can attack any ship that is the target of a contract.</TEXT><PARA/><TEXT>- Cannot use Battlecruisers, Battleships, or ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

;SRP 21 (dsy_license_srp_21) - MCS-Nightmare
853142= MCS-Nightmare
853143= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The MCS-Nightmare is a Storta Destroyer, first purchased by the Vagrant Raiders in 817A.S. She now operates independently as a mercenary vessel for hire, specializing in heavy weapons support.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This SRP ID is used by the captain of the MCS Nightmare, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack any ship that is the target of a contract.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

;SRP 22 (dsy_license_srp_22) - Order|CV-Montana
853144= Montana
853145= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Montana is an Arbiter-class battleship that found its way into the service of the Order a few years after the fall of the Liberty Insurrection. Operating as a psuedo-mobile station, the Montana is one of the few Dreadnought-class vessels that the Order has access to.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Independent Intelligence SRP ID is used by the captain of the Montana, who:</TEXT><PARA/><TRA color="white"/><TEXT> </TEXT><PARA/><TEXT>- Can attack any ship to assist an Order ship.</TEXT><PARA/><TEXT>- Can attack Combat Ships considered hostile by The Order.</TEXT><PARA/><TEXT>- Can attack Intelligence ships, and ships using Alien equipment.</TEXT><PARA/><TEXT>- Can engage in piracy against ships considered hostile by The Order.</TEXT><PARA/><TEXT>- Can demand Alien and Core equipment and materials.</TEXT><PARA/><TEXT>- Can enforce laws within the Omicrons.</TEXT><PARA/><POP/></RDL>

