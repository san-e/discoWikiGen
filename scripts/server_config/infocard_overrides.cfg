853676= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Brotherhood is one of the three old major Corsair forces. Originally the group's influence was more focused on battlefields, thus they were often referred to as "The shield and the sword of the Empire", however, with the downfall of the two other major Corsair groups, Black Sails and the Benitez Family, The Brotherhood took over many of their duties.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Independent Unlawful official faction ID is used by corsairs of the Brotherhood, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack any ship carrying Hessian Tears or Cardamine.</TEXT><PARA/><TEXT>- Can attack any hostile ship in Omicron Gamma</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within their Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Bretonia, Kusari, Omegas, Omicrons, Rheinland, Sigmas, Dublin</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack combat ships.</TEXT><PARA/><TEXT>- Can engage in piracy.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TEXT>Mining Bonuses: Xeno Relics (3.5x), Gold Ore (3.5x)</TEXT><PARA/><TEXT> </TEXT><PARA/><POP/></RDL>

