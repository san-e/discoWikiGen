852594=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>Ageira Technologies, one of Liberty's "Big Three", is the Liberty corporation responsible for the development of Jump Gate and Trade Lane technologies. They partner with Universal Shipping and Deep Space Engineering.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Liberty Corporate ID is used by Ageira Technologies employees, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can demand Black Market Munitions and Ageira or Gallic Gate/Lane Parts.</TEXT><PARA/><TEXT>- Can engage in piracy against competitors outside of House Space.</TEXT><PARA/><TEXT>- Can attack Lane Hackers.</TEXT><PARA/><TEXT>- Can treat any system containing a DSE Gate Construction Site as part of their ZOI.</TEXT><PARA/><TEXT>- Cannot use Cruisers, Battlecruisers, or Battleships.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within their Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Liberty +1, Copernicus, Coronado, Vespucci</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships considered hostile by Liberty.</TEXT><PARA/><TEXT>- Can attack competitors outside of Liberty.</TEXT><PARA/><TEXT>- Can engage in piracy against Corporate ships outside of Liberty.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

