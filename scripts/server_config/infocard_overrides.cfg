853687=.:j:. Junker Congress ID
853688=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Junkers are a group of smugglers and black market traders who maintain a legal front through scrap peddling. They are remarkable for being one of the few organisations to preserve their neutrality in the war between Corsairs and Outcasts, regularly trading with both parties.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Independent Quasilegal official faction ID is used by junkers of the Junker Congress, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack Hogosha and Xenos.</TEXT><PARA/><TEXT>- Can engage in piracy.</TEXT><PARA/><TEXT>- Cannot use Cruisers, Battlecruisers, Battleships, or ships with more than 4,300 cargo space, other than .:j:. Voerde and .:j:.Prague.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

