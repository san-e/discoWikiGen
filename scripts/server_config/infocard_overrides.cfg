852765=Gallic National Intelligence ID
852766=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>Gallic National Intelligence (GNI) is Gallia's newly formed intelligence department, decoupled from the Navy and given carte blanche to investigate and pursue matters relating to counter-terrorism and national security.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Gallic Intelligence ID is used by operatives in Gallic National Intelligence, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack combat ships considered hostile by Gallia.</TEXT><PARA/><TEXT>- Can engage in piracy against ships considered hostile by Gallia.</TEXT><PARA/><TEXT>- Can attack Intelligence ships.</TEXT><PARA/><TEXT>- Can demand Alien equipment and materials.</TEXT><PARA/><TEXT>- Cannot use Battleships, or ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Gallia +1, Taus, Cologne</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships considered hostile by Gallia.</TEXT><PARA/><TEXT>- Can enforce laws within Gallia and Zurich.</TEXT><PARA/><TEXT>- Can attack Bretonian, Crayter Republic, and Kusari combat ships within the Taus.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TEXT>Outside Zone of Influence:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Must only attack in self-defense while using Cruisers or Battlecruisers.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

;dsy_license_ga_p_grp
852767=Gallic Gendarmerie ID
852768=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Gendarmerie is the military police authority of Gallia, operating under the direct supervision of the Navy. They settle disputes, protect civilians, and hunt criminals within Gallia and Zurich.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Gallic Military Police ID is used by gendarmes of the Gendarmerie, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Cannot use Battleships or ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Gallia +1</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships considered hostile by Gallia.</TEXT><PARA/><TEXT>- Can enforce laws within Gallia and Zurich.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

;dsy_license_ga_n_grp
852769=Gallic Navy ID
852770=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Gallic Navy represents the bulk of Gallia's remaining military and police forces, organised under one banner. The eclectic mix of former Royalists and Council members now serving together in many ways represents the shaky and awkward political landscape of the newly unified Gallic state.</TEXT><PARA/><PARA/><TEXT>This Gallic Military ID is used by Gallic Navy servicemembers, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack Bretonian and Kusari combat ships in the Taus.</TEXT><PARA/><TEXT>- Cannot use ships with more than 4,300 cargo space.</TEXT><PARA/><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Gallia +1, Cologne, Tau-29, Tau-31</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships considered hostile by Gallia.</TEXT><PARA/><TEXT>- Can enforce laws in Gallia.</TEXT><PARA/><PARA/><TRA color="default"/><POP/></RDL>

