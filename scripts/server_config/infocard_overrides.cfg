852845=Menhir Irregulars ID
852846=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>In eternal service to their otherworldly masters, these social pariahs have been ripped away from their former lives and mixed into one big family of looters and mercenaries best known for their unstable hierarchy and chaotic behavior.</TEXT><PARA/><TEXT></TEXT><PARA/><TEXT>Like many other groups of thralls scattered across Sirius, The Menhir Irregulars remain completely unaware of the role they play in the Nomads' inscrutable plans.</TEXT><PARA/><TEXT></TEXT><PARA/><TEXT>This unlawful ID is used by pilots of The Menhir Irregulars, who:</TEXT><PARA/><TEXT></TEXT><PARA/><TEXT>Within Zone of Influence (Rheinland +1, Kusari +1, Bretonia +1, Omegas +1, Omicrons, systems which contain a Wild base):</TEXT><PARA/><TEXT></TEXT><PARA/><TEXT>- Cannot demand credits</TEXT><PARA/><TEXT>- Can demand cargo from any ship</TEXT><PARA/><TEXT>- Can attack combat ships</TEXT><PARA/><TEXT>- Can attack any ship that is the target of a contract</TEXT><PARA/><TEXT>- Cannot use Cruisers, Battlecruisers, Battleships or ships with more than 4,300 cargo space</TEXT><PARA/><TEXT></TEXT><PARA/><TEXT>Outside of Zone of Influence:</TEXT><PARA/><TEXT></TEXT><PARA/><TEXT>- Can engage Wendigo and Order ships anywhere, except transports.</TEXT><PARA/><POP/></RDL>

;dsy_license_br_n_grp
852567=Bretonia Armed Forces ID
852568=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Bretonian Armed Forces, a veteran military bloodied by two wars, represents the first and last line of defence for the Kingdom of Bretonia.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Bretonian Military ID is used by Bretonia Armed Forces servicemembers, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack Gallic combat ships within the Taus.</TEXT><PARA/><TEXT>- Cannot use ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Bretonia +1, Omega-7, Tau-23, Tau-29</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships considered hostile by Bretonia.</TEXT><PARA/><TEXT>- Can enforce laws within Bretonia, Dublin, and Omega-3.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

; dsy_license_pf_12_grp
852847=BAF| Bretonia Armed Forces ID
852848=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Bretonian Armed Forces, a military weakened by two wars, represents the first and last line of defence for the Kingdom of Bretonia. Having protected their people and Queen from the might of Kusari, Gallia emerged as the new existential threat to Bretonia, one that had been finally beaten after several years of brutal conflict that saw millions perish. Having suffered so much, the Armed Forces are hard-pressed to maintain a high standard of discipline and training, lest the Kingdom would collapse due to the Crown's many rivals.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Bretonian Military official faction ID is used by Bretonia Armed Forces servicemembers, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack Gallic combat ships within the Taus.</TEXT><PARA/><TEXT>- Cannot use ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Bretonia +1, Omega-7, Tau-23, Tau-29</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships considered hostile by Bretonia.</TEXT><PARA/><TEXT>- Can enforce laws within Bretonia, Dublin, and Omega-3.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

