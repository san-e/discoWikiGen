985454= Gallic Navy
989311= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TRA data="1" mask="1" def="-2"/><TEXT>ALLIES:  </TEXT><PARA/><TRA data="0" mask="1" def="-1"/><TEXT>GNI, Gallic Corporations</TEXT><PARA/><PARA/><TRA data="1" mask="1" def="-2"/><TEXT>ENEMIES: </TEXT><PARA/><TRA data="0" mask="1" def="-1"/><TEXT>Gallic Brigands, The Maquis, Gallic Royalists, Outcasts</TEXT><PARA/><PARA/><TEXT>The Gallic Navy represents the bulk of Gallia's remaining military and police forces, organised under one banner. In many ways the conglomerated navy represents the Union it now serves, an eclectic mix of former Royalist and Confederal officers joining with ex-Council and Burgundian warlords, all serving as an iron fist with which to hold Gallia together.</TEXT><PARA/><POP/></RDL>

;dsy_license_ga_roy_grp
852801= Gallic Royalist ID
852802=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Gallic Royalists are a splinter group of fanatical monarchists and Royal Navy officers who fled to the Taus after their defeat at the hands of the Council, Liberty, and Bretonia. Their tattered battlegroup clings to the lofty goal of re-establishing an absolute monarchy.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Gallic Unlawful ID is used by Gallic Royalists, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Cannot use Cruisers, Battlecruisers, Battleships, or ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Gallia +1, Taus +1, Magellan, New London</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack combat ships.</TEXT><PARA/><TEXT>- Can engage in piracy.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

