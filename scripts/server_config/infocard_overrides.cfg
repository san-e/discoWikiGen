853683=IMG| Independent Miners Guild ID
853684= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Independent Miners Guild is a confederation of miners that operate outside of House Space. The IMG| is the main body of the Guild, which consists mainly of moderate, law-abiding workers who want to keep their neutrality with the Houses by avoiding confrontation with those. Therefore, their shady links to unlawful groups like Mollys and Hessians are kept secret. The Guild holds significant influence in the Borderworlds, while at the same time pushing into uncharted territory in the quest for undiscovered resources. The Guild is locked in an existential struggle against the Outcasts in the Taus.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Independent Corporate official faction ID is used by Independent Miners Guild members, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack any ship in defense of allied ships.</TEXT><PARA/><TEXT>- Can engage in piracy against competitors outside of House Space.</TEXT><PARA/><TEXT>- Cannot dock Cruisers, Battlecruisers, or Battleships in House Space, except on IMG bases.</TEXT><PARA/><TEXT>- Cannot use ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Bretonia +1, Taus, Omegas</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships considered hostile by the IMG.</TEXT><PARA/><TEXT>- Can attack competitors outside of Bretonia.</TEXT><PARA/><TEXT>- Can enforce laws outside Bretonia.</TEXT><PARA/><TEXT>- Can engage in piracy against Corporate ships outside of Bretonia.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TEXT>Mining Bonuses: Niobium Ore (3.5x), Gold Ore (3.5x), Silver Ore (3.5x), Copper Ore (3.5x)</TEXT><PARA/><TEXT> </TEXT><PARA/><POP/></RDL>

