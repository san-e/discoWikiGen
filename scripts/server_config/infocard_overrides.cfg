;SRP 7 (dsy_license_srp_07) - BAF|HMS-Hellbound
852991= BAF|HMS-Hellbound
852992= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Bretonian Armed Forces, a military weakened by two wars, represents the first and last line of defence for the Kingdom of Bretonia. Having protected their people and Queen from the might of Kusari, Gallia emerged as the new existential threat to Bretonia, one that had been finally beaten after several years of brutal conflict that saw millions perish. Having suffered so much, the Armed Forces are hard-pressed to maintain a high standard of discipline and training, lest the Kingdom would collapse due to the Crown's many rivals.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Bretonian Military official faction SRP ID is used by the captain of the HMS Hellbound, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack Gallic and Kusari combat ships within the Taus.</TEXT><PARA/><TEXT>- Cannot use ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Bretonia +1</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships considered hostile by Bretonia.</TEXT><PARA/><TEXT>- Can enforce laws within Bretonia, Dublin, and Omega-3.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

