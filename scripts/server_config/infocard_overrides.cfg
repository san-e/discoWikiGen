853658= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>Malta Hyperspace Starfleet is an organization that focuses on science and technology, to ensure Outcast dominion throughout all Sirius. Formed by intellectuals and warmongers, they pursue new research and knowledge to improve the spreading of Cardamine and the protection of their brethren. They consider themselves as open-minded, collaborating with anyone who provides assistance to the Outcasts and not hesitating to use any available resource or method to achieve their goals.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Independent Unlawful official faction ID is used by members of the Malta Hyperspace Starfleet, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack any ship carrying Artifacts, Stabiline or Nox.</TEXT><PARA/><TEXT>- Can attack any hostile ship in Omicron Alpha</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Bretonia, Kusari, Liberty, Omicrons, Sigmas, Taus, Coronado, Cortez, Galileo, Inverness, Kepler, Languedoc, Magellan, Ontario</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack combat ships.</TEXT><PARA/><TEXT>- Can engage in piracy.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TEXT>Mining Bonuses: Xeno Relics (3.5x), Niobium Ore (3.5x)</TEXT><PARA/><TEXT> </TEXT><PARA/><POP/></RDL>

