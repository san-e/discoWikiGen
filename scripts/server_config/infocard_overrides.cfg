852631=Gaian ID
852632=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Gaians are a grassroots, radical group opposed to terraforming and uncontrolled industrialization. Their chief opponent and target is Planetform, especially in defense of the threatened Planet Gaia from which the movement draws its name.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Bretonian Unlawful ID is used by members of the Gaians, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack BMM, Planetform and Cryer, and treat systems containing a BMM or Planetform base as part of their ZOI.</TEXT><PARA/><TEXT>- Can attack ships carrying Gaian Wildlife or Terraforming Gases.</TEXT><PARA/><TEXT>- Cannot use Battleships, or ships with more than 4,300 cargo space, other than the Corsair Train.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Bretonia +1, Taus, Coronado, Ontario, Inverness, Kansas, Omega-49, Vespucci</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack combat ships.</TEXT><PARA/><TEXT>- Can engage in piracy.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

;dsy_license_fc_m_grp
852625=Mollys ID
852626= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Mollys are a Bretonian separatist group formed by former BMM employees committed to a Dublin free and independent of Bretonian rule. Their indiscriminate attacks against civilian and military traffic alike have left them branded terrorists by all major governments and corporations.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Bretonian Unlawful ID is used by members of the Mollys, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack BMM.</TEXT><PARA/><TEXT>- Cannot use Battleships, or ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Bretonia, Dublin, +1</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack combat ships.</TEXT><PARA/><TEXT>- Can engage in piracy.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TEXT>Mining Bonuses: Gold Ore (3x)</TEXT><PARA/><TEXT> </TEXT><PARA/><POP/></RDL>

;dsy_license_fc_h_grp
852623=Hogosha ID
852624=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Hogosha are a quasi-legal organization that ostensibly exists to promote the "welfare and prosperity of the Kusari people." With influential agents inside Samura, Kishiro, and even in the halls of Kusari government, the Hogosha syndicates are one of the strongest power blocs underpinning modern Kusari society.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Kusari Quasilegal ID is used by members of the Hogosha, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack Junkers.</TEXT><PARA/><TEXT>- Cannot use Cruisers, Battlecruisers, or Battleships.</TEXT><PARA/><TEXT>- Cannot use ships with more than 4,300 cargo space, except for the Corsair Train.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Kusari +1, Sigmas, Taus</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships considered hostile by Kusari.</TEXT><PARA/><TEXT>- Can enforce laws within Kusari.</TEXT><PARA/><TEXT>- Can engage in piracy.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

;dsy_license_fc_corse_grp
852779=Unione Corse ID
852780=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Unione Corse is an organised criminal syndicate which focuses on smuggling, black market trade, and mercenary work in Gallia. Despite their rumored links to the Nox trade and the Gallic criminal underground, the Unione Corse nevertheless remains a legal organization.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Gallic Quasilegal ID is used by members of the Unione Corse, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack any ship that is carrying Cardamine.</TEXT><PARA/><TEXT>- Can attack any ship that is the target of a contract.</TEXT><PARA/><TEXT>- Can attack other bounty hunting organisations outside of house space targeting the same bounty.</TEXT><PARA/><TEXT>- Cannot use Cruisers, Battlecruisers, Battleships, or ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Gallia +1, Taus</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can engage in piracy.</TEXT><PARA/><TEXT>- Can enforce laws within Provence.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

