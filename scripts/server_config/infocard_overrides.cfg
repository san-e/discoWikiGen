787171=Hybridised Equipment
787172=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TRA data="1" mask="1" def="-2"/><JUST loc="center"/><TRA data="0" mask="1" def="-1"/><JUST loc="left"/><TEXT>This industrial equipment is an unsettling blend of human and Nomad technology. During the long isolation of Omega-58, Kaarst was forced to cannibalize much of its own machinery to sustain the surviving Wild hibernating within. These supplies have been dispatched from the deep Omicrons to resupply these extremely depleted stocks, resuming Kaarst's terrifying operations.</TEXT><PARA/><POP/></RDL>

