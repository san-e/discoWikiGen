853653=A/)- Technocracy of Auxo ID
853654= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Technocracy of Auxo is a secretive transhumanist society dedicated to the advancement of science, the responsible custodianship of knowledge, and the preservation of sentient life. They favor isolationism as a tactic to safeguard themselves and further their internal academic freedom, relying upon a discreet network of agents and collaborators to observe and interact with the outside world.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>The Technocracy's ideals put them at odds with entities such as The Core and Order, whose greed and wrath against non-humans like the Gammu are seen as counter-productive to the advancement of all species and societies. In spite of the Technocrats' isolation and distrustful outlook towards outsiders, they are known to welcome those from all walks of life should they display true dedication to the cause, presenting themselves as a new form of unity above and outside internecine human struggles.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Independent Intelligence official faction ID is used by technocrats of the Technocracy of Auxo, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack Core and Intelligence ships.</TEXT><PARA/><TEXT>- Can demand Alien materials and Cardamine.</TEXT><PARA/><TEXT>- Cannot use Cruisers, Battlecruisers, Battleships, or ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Bretonia +1, Liberty, Inverness, Kansas, Ontario, Vespucci, Omegas, Omicrons</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships considered hostile by the Technocracy of Auxo.</TEXT><PARA/><TEXT>- Can enforce laws within Inverness, Omega-48, Omicron Pi, Ontario, Kansas, and Vespucci.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TEXT>Mining Bonuses: Xeno Relics (3.5x), Azurite Gas (3.5x)</TEXT><PARA/><TEXT> </TEXT><PARA/><POP/></RDL>

