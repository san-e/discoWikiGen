;531484 =

;dsy_license_coalition
852722= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Coalition as the Sirius Sector knows it sprang into life some time into the early 600s AS, formed by a motley band of ex-Corsairs, Rheinland dissidents and unaligned sympathizers. Claiming to be the descendants of Sol Coalition saboteurs that disabled the Hispania, they have managed to create a facsimile of their ancestors' home deep in the Omegas.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Independent Military ID is used by Coalition pilots, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Cannot use ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Omegas +1, Bretonia, Dublin, Rheinland</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack combat ships considered hostile by the Coalition.</TEXT><PARA/><TEXT>- Can engage in piracy against ships considered hostile by the Coalition.</TEXT><PARA/><TEXT>- Can enforce laws in Omega-52.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

;dsy_license_fc_lr_grp
852643= Liberty Rogues ID
852644= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Liberty Rogues are a motley assortment of petty criminals who operate mainly in Liberty, attacking targets of opportunity and fencing illegal goods, namely Outcast cardamine.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Liberty Unlawful ID is used by Liberty Rogues, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Cannot use Battleships, or ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Liberty +1, Copernicus, Coronado, Inverness, Shikoku, Vespucci</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack combat ships.</TEXT><PARA/><TEXT>- Can engage in piracy.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

852971= NEMP Bomb Launcher
852972= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TRA bold="true"/><JUST loc="center"/><TEXT>NEMP Bomb Launcher System</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="red" bold="default"/><JUST loc="left"/><TEXT>WARNING: This weapon poses a huge risk of Friendly Fire. Use at your own risk!</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="aqua" italic="true"/><TEXT>We knew the world would not be the same. A few people laughed, a few people cried, most people were silent. I remembered the line from the Hindu scripture, the Bhagavad-Gita... &quot;Now, I am become Death, the destroyer of worlds.&quot;</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="0xF524056832" italic="default"/><TEXT>The use of NEMP ordinance has seen a considerable resurgence within the Sirius sector after the first attacks by criminal elements on orbital constructions yielded high results. Relatively cheap and low-cost, the technology turned out to work surprisingly well against the complex and sensitive systems used to provide life in interstellar space. While planetside installations can be shielded with relative ease, the NEMP has much more devastating results out in open vacuum where the already-present cosmic interference amplifies the effect and, in many cases, may lead to a catastrophic failure in ship reactors, regardless of the fuel being used.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>The launcher consists of two separately fired warheads - the MAIN and INITIATOR which, upon hitting the target, cause an uncontrolled, unshielded spew of particles of a wide spectrum, bypassing shields and armor alike. The most expensive part of the NEMP Launcher system is, however, the warhead itself - equipped with both a highly sophisticated tracking uplink as well as a failsafe system to detonate the payload if damaged. The ordinance is still susceptible to Countermeasures and as such, should be shot at targets either stationary or ones that do not employ them.</TEXT><POP/></RDL>
852974= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TRA bold="true"/><JUST loc="center"/><TEXT>NEMP Bomb</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="red" bold="default"/><JUST loc="left"/><TEXT>Warning: The NEMP Bomb Launcher needs two (2) ammo to fire!</TEXT><POP/></RDL>

;Researcher ID (dsy_license_researcher)
852749= Researcher ID
852750= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>Researchers embody the curiosity, hope, determination, and boldness of mankind. However, their intentions may sometimes vary from the pure to the self-serving.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Independent Quasilegal ID is used by researchers, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Cannot use Cruisers, Battlecruisers, Battleships, or ships with more than 3,600 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

;Bretonian Privateer (dsy_license_privateer)
852753=DISCONTINUED ID
852754=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><JUST loc="center"/><PARA/><TRA color="red" bold="true" /><TEXT>THIS ID IS NO LONGER IN USE.</TEXT><POP/></RDL>

;Militant ID (dsy_license_fc_militant)
852761= Militant ID
852762= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>Militants are Zoner pilots who have taken up arms to protect other Zoners from the encroaching influence of foreign militaries and savage pirates, or those who have refused to accept compromises over past grievances and instead seek their own form of revenge.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Independent Unlawful ID is used by Zoner Militants, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Cannot use Battlecruisers, Battleships, or ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Liberty +1, Bretonia, Dublin, Omegas, Systems containing a Zoner base</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack combat ships.</TEXT><PARA/><TEXT>- Can engage in piracy.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

656272=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TRA data="1" mask="1" def="-2"/><JUST loc="center"/><TEXT>ZBT-1002 "Whale" Zoner Deep Space Transport</TEXT><PARA/><TRA data="0" mask="1" def="-1"/><JUST loc="left"/><TEXT> </TEXT><PARA/><TEXT>Based in many ways upon the design philosophy employed by the GMG Kujira class transport, the ZBT is effectively a hardened radiation shell providing support for her massive engines to ferry her spacious cargo with unmatched agility. Forgoing traditional arms and armament, the Zoners rely instead upon their studiously cultivated diplomatic ties to assure the safety of the vessel.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>Sales of the ZBT are explicitly prohibited to non-Zoners and those vessels encountered flown under any other flag are assumed to have been acquired by nefarious means, and their destruction rewarded appropriately. The technology of its internal frame is held under strict secrecy and the ship's engine power that ensures it almost unmatched agility is also jealously guarded.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="red"/><TEXT>May only be used with a Zoner ID.</TEXT><TRA color="default"/><PARA/><POP/></RDL>

;dsy_license_fc_lwb_grp
852640=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The LWB is a collection of radical farmers devoted to eradicating Synth Foods from Planet Stuttgart. The LWB previously fell apart to infighting, with survivors being absorbed by the Farmer's Alliance. The LWB has since violently broken away from the Alliance to assert their independence again.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Rheinland Unlawful ID is used by members of the LWB, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack Synth Foods.</TEXT><PARA/><TEXT>- Can attack ships carrying Agricultural Machinery, Biodome Materials, Fertilizers or Synth Paste.</TEXT><PARA/><TEXT>- Cannot use Battleships, or ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Rheinland +1, Zurich, Champagne, Sigmas, Omegas</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack combat ships.</TEXT><PARA/><TEXT>- Can engage in piracy.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

;LWB faction
989277=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TRA data="1" mask="1" def="-2"/><TEXT>ALLIES:  </TEXT><PARA/><TRA data="0" mask="1" def="-1"/><TEXT>Gaians, Red Hessians</TEXT><PARA/><TRA data="1" mask="1" def="-2"/><TEXT> </TEXT><PARA/><TEXT>ENEMIES: </TEXT><PARA/><TRA data="0" mask="1" def="-1"/><TEXT>Bounty Hunters, Corsairs, Farmer's Alliance, Rheinland Police, Rheinland Military, Synth Foods</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>The LWB, or Landwirtrechtbewegung (Farmers' Rights Movement), is engaged in attacks on Synth Foods to expel the Liberty Food conglomerate from Stuttgart. After falling apart to in-fighting, the remnants were absorbed by the Farmer's Alliance. The rejuvenated LWB later violently broke away from the Alliance commanders who treated them like disposable pawns.</TEXT><PARA/><POP/></RDL>

;dsy_license_fc_fa_grp
852641=Farmers Alliance ID
852642=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Farmers Alliance was originally a Kusarian political organisation that lobbied for farmers rights, before turning to direct action against Synth Foods. Their overt attacks on foreign shipping and consolidation with the LWB have left them branded as terrorists, though they still enjoy unofficial financial support from their backers in Samura.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Kusari-Rheinland Unlawful ID is used by members of the Farmers Alliance, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack Synth Foods.</TEXT><PARA/><TEXT>- Can attack ships carrying Synth Paste or Biodome Materials.</TEXT><PARA/><TEXT>- Cannot use Battleships, or ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Kusari +1, Rheinland +1, Sigmas, Omegas</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack combat ships.</TEXT><PARA/><TEXT>- Can engage in piracy.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

852617= Red Hessians ID
852618= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Red Hessians are a large and well-organized pirate group in Rheinland who attack civilian and commercial targets of opportunity. Originally formed as a radical political movement fighting against harsh working practices, the average Hessian is nowadays more interested in simple piracy and theft.</TEXT><PARA/><TEXT></TEXT><PARA/><TEXT>This Rheinland Unlawful ID is used by Red Hessian pirates, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships carrying Artifacts.</TEXT><PARA/><TEXT>- Can attack Daumann, Kruger in Omega 11, Omega 7, Dresden.</TEXT><PARA/><TEXT>- Cannot use ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT></TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Rheinland, Omegas +1, Cologne, Zurich</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack combat ships.</TEXT><PARA/><TEXT>- Can engage in piracy.</TEXT><PARA/><TEXT></TEXT><PARA/><TRA color="default"/><TEXT>Mining Bonuses: Uncut Diamonds (3x)</TEXT><PARA/><TEXT></TEXT><PARA/><POP/></RDL>

; dsy_license_fc_bd_grp
852619=Blood Dragons ID
852620=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Blood Dragons are a terrorist organization supposedly descended from the royal guard of Shogun Hideyoshi -- deposed during a coup several centuries before -- and are dedicated to the overthrow of the current Kusari government, and the destruction of Samura Industries.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Kusari Unlawful ID is used by members of the Blood Dragons, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack Samura, Hogosha, and Farmers Alliance.</TEXT><PARA/><TEXT>- Cannot use Battleships or ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Kusari +1, Sigmas</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack combat ships.</TEXT><PARA/><TEXT>- Can engage in piracy.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

; dsy_license_marineintel
852755=Marinenachrichtendienst ID
852758=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Marinenachrichtendienst (MND) is the intelligence agency of Rheinland, formed after the Colony Wars with the explicit mandate of investigating the Rheinland Military. While their purview has broadened to general national security since, their relationship with the military has never improved.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Rheinland Intelligence ID is used by operatives of the Marinenachrichtendienst, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack combat ships considered hostile by Rheinland.</TEXT><PARA/><TEXT>- Can attack GMG combat ships within the Sigmas.</TEXT><PARA/><TEXT>- Can engage in piracy against ships considered hostile by Rheinland.</TEXT><PARA/><TEXT>- Can attack Intelligence ships.</TEXT><PARA/><TEXT>- Can demand Alien equipment and materials.</TEXT><PARA/><TEXT>- Cannot use Battleships, or ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Rheinland +1, Zurich</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships considered hostile by Rheinland.</TEXT><PARA/><TEXT>- Can enforce laws within Rheinland, Cologne, Dresden and Sigma-15.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TEXT>Outside Zone of Influence:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Must only attack in self-defense while using Cruisers or Battlecruisers.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

