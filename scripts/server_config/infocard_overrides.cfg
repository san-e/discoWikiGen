;Scientific Data - commodity_sciencedata
786972=Scientific Data
786973=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TRA bold="true"/><JUST loc="center"/><TEXT>Scientific Data</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA bold="default"/><JUST loc="left"/><TEXT>Whether it comes in the form of old written archives or digital recordings, guncam footage, weapon readings, recovered research data from terminals, black boxes or simple written-down experiences or observations by pilots and scientists alike - </TEXT><TRA color="blue"/><TEXT>Scientific Data</TEXT><TRA color="default"/><TEXT> is a much sought after ''commodity'' by any individual or group that specialize in technological advancement and scientific study. The possible findings in this sort of data may pave a way to new prototypes and technologies to be manufactured and implemented. Some of them - perhaps even mass-produced.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT> </TEXT><PARA/><TRA bold="true"/><TEXT>OORP Information starts here</TEXT><PARA/><TRA bold="default"/><TEXT>You have found an event item. A single unit of the ''Scientific Data'' commodity represents one (1) ''point'' of recovered information of various kinds, retrieved from various sites by various means. These points can then later be used to unlock certain types of event gear and temporary boosts to the player's ship of choice. The boosts are, however, temporary - usually lasting for around a month or two, depending on the amount of points that are spent. The ''Level'' and ''Type'' of boost will depend on the roleplay you have created on the forum around the data as well as the amount of the &quot;Scientific Data&quot; commodity you have and the ship/ID combination as well as the intended use/role of the ship. For more information, contact an administrator on the forums @Discoverygc.com</TEXT><POP/></RDL>

; Universal Armor Upgrade Mk X - dsy_event_armor1
852959=Universal Armor Upgrade Mk X
852960=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TRA data="1" mask="1" def="-2"/><JUST loc="center"/><TEXT>Universal Armor Upgrade Mk X</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA data="0" mask="1" def="-1"/><JUST loc="left"/><TEXT>Spaceship armor upgrade is an essential piece of equipment for anyone heading in distant dangerous areas of Sirius sector. The Mk X uses experimental alloy and technologies to provide the best possible protection at the least impact on ship weight and handling. The outer hull plating has been the biggest change if compared to the Mk VIII - introducing relatively untested designs and solutions in order to mitigate incoming damage. Multiplies base armor by 3.0; occupies 20 cargo space.</TEXT><PARA/><TEXT>Note: This is prototype technology and it will degrade over time until the hull plating will be required to be replaced. The experimental plating should last for around a month or two.</TEXT><PARA/><POP/></RDL>

; Capital Armor Upgrade Mk X - dsy_event_armor2
852961=Capital Armor Upgrade Mk X
852962=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TRA data="1" mask="1" def="-2"/><JUST loc="center"/><TEXT>Capital Ship Armor Upgrade Mk X</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA data="0" mask="1" def="-1"/><JUST loc="left"/><TEXT>Armor upgrades specially developed for capital ships offer a much higher degree of protection, but also tend to occupy much more cargo space. The Mk X is not only an exception, but also a step beyond what military installations had access to over the years. The materials and technology used to manufacture this particular plating includes the use of highly rare alloys that allow the reduction of overall weight and a surprising amount of resilience in comparison to the closest alternative - the Mk VIII, making it one of the most rare experimental armor upgrades available. Multiplies base armor by 5.0; occupies 250 cargo space.</TEXT><PARA/><TEXT>Note: This is prototype technology and it will degrade over time until the hull plating will be required to be replaced. The experimental plating should last for around a month or two.</TEXT><PARA/><POP/></RDL>

