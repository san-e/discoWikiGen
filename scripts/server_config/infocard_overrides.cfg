852651= Independent Miners Guild ID
852652= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Independent Miners Guild (IMG) is a loose confederation of miners who work in the undeveloped border worlds, staking claims and harvesting deposits far from the reach of the larger corporations. They often compete with House Corporations over their mineral claims in the border worlds.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Independent Corporate ID is used by Independent Miners Guild members, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack any ship in defense of allied ships.</TEXT><PARA/><TEXT>- Can engage in piracy against competitors outside of House Space.</TEXT><PARA/><TEXT>- Cannot dock Cruisers, Battlecruisers, or Battleships in House Space, except on IMG bases.</TEXT><PARA/><TEXT>- Cannot use ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Bretonia +1, Taus, Omegas</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships considered hostile by the IMG.</TEXT><PARA/><TEXT>- Can attack competitors outside of Bretonia.</TEXT><PARA/><TEXT>- Can engage in piracy against Corporate ships outside of Bretonia.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TEXT>Mining Bonuses: Niobium Ore (3x), Silver Ore (3x), Copper Ore (3x), Gold Ore (3x)</TEXT><PARA/><TEXT> </TEXT><PARA/><POP/></RDL>

