852837=Special Operative ID
852838=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TRA data="1" mask="1" def="-2"/><JUST loc="center"/><TEXT>Special Operative:</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA data="0" mask="1" def="-1"/><JUST loc="left"/><TEXT>The owner of this ID must follow the written restrictions of the Special Roleplay Request made in order to obtain this ID, and may not act outside the boundaries specified in their request. Pilot carrying this ID is associated with the faction they display as their IFF.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>Allowed ships: Fighters, Freighters, Transports, Gunboats, Cruisers, Battleships</TEXT><PARA/><TEXT>This ID can only be given by an Admin and may not be transferred or replaced without Admin permission.</TEXT><PARA/><POP/></RDL>

; dsy_license_pf_08_grp
852839=Order| Order Primary Fleet ID
852840= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Order is an organisation which has its roots in Liberty. Founded to counter the threat posed by subversion of human bodies by the aliens known as "Nomads", the Order operates Siriuswide to counteract Nomad activity. They are considered a terrorist faction by all major Houses, except Gallia, and are in conflict with The Core. Their allies include the Bundschuh and the Blood Dragons.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Independent Intelligence official faction ID is used by operatives of the Order Primary Fleet, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack Combat Ships considered hostile by The Order.</TEXT><PARA/><TEXT>- Can attack Intelligence ships, and ships using Alien equipment.</TEXT><PARA/><TEXT>- Can engage in piracy against ships considered hostile by The Order.</TEXT><PARA/><TEXT>- Can demand Alien and Core equipment and materials.</TEXT><PARA/><TEXT>- Can enforce laws within the Omicrons.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TEXT>Mining Bonuses: Azurite Gas (3.5x), Iridium Ore (3.5x), Xeno Relics (3.5x)</TEXT><PARA/><TEXT> </TEXT><PARA/><POP/></RDL>

;dsy_license_fc_or_grp
852645=The Order ID
852646= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Order is an organisation which has its roots in Liberty and now operates Sirius-wide to counter the threat posed by the Nomads. They are considered a terrorist faction by all major Houses, working from the shadows with their allies in the Bundschuh and Blood Dragons.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Independent Intelligence ID is used by Order operatives, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack Combat Ships considered hostile by The Order.</TEXT><PARA/><TEXT>- Can attack Intelligence ships, and ships using Alien equipment.</TEXT><PARA/><TEXT>- Can engage in piracy against ships considered hostile by The Order.</TEXT><PARA/><TEXT>- Can demand Alien and Core equipment and materials.</TEXT><PARA/><TEXT>- Can enforce laws within the Omicrons.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TEXT>Inside House Space:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Cannot use Cruisers, Battlecruisers, or Battleships, except for the "Resheph" Recon Cruiser.</TEXT><PARA/><TEXT>- "Resheph" Recon Cruisers can only engage Alien ships unless acting in self-defense.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TEXT>Mining Bonuses: Azurite Gas (3x), Iridium Ore (3x), Xeno Relics (3x)</TEXT><PARA/><TEXT> </TEXT><PARA/><POP/></RDL>

; dsy_license_pf_09_grp
852841=Shinsei Clan ID
852842= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Shinsei Clan is a specialized branch of the Gas Miners Guild capable of operating with greater flexibility than the main Guild. The Clan focuses on deploying heavy assets and carrying out large-scale mining operations using cutting-edge gas extraction and refining technologies, particularly in the Crow Nebula, where traditional mining methods are becoming obsolete.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Independent Corporate ID is used by a member of the Shinsei Clan, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can engage in piracy against competitors outside of House Space.</TEXT><PARA/><TEXT>- Cannot use Cruisers, Battlecruisers, or Battleships.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Sigmas +1, Kusari +1</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships considered hostile by GMG.</TEXT><PARA/><TEXT>- Can attack Rheinland combat ships outside of Kusari.</TEXT><PARA/><TEXT>- Can attack competitors outside of House Space.</TEXT><PARA/><TEXT>- Can engage in piracy against Corporate ships outside of Kusari.</TEXT><PARA/><TEXT>- Can enforce laws within the Sigmas.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TEXT>Mining Bonuses: Helium-3 (3.5x)</TEXT><PARA/><TEXT> </TEXT><PARA/><POP/></RDL>

