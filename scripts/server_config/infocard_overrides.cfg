;SRP 15(dsy_license_srp_15) - TFP)-HFB-Incursus
853007= TFP)-HFB-Incursus ID
853008= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT> The Incursus is a relic of a vessel, dating back to an era where Houses feared the unknown of the edge worlds and revolution was sparked by action instead of blame. Gifted to the Hellfire Legion in exchange for the Spyglass scanner technology now employed in the Order's own Resheph recon cruisers, the Incursus never faltered in her mission to bring justice through force. Despite her length of service, she and those who command her remain ever ready to continue the mission.  This Liberty/Independent Unlawful ID is used by the Incursus, which:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack Liberty Military, Police, and Intelligence ships.</TEXT><PARA/><TEXT>- Can demand Cardamine, Nomad Equipment/Materials, Xeno Relics, and Counterfeit Computerware.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT> Within Zone of Influence (Liberty +1, Vespucci +1, Coronado, Inverness, Hamburg):</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack combat ships.</TEXT><PARA/><TEXT>- Can escort civilian transports and miners.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

;SRP 16(dsy_license_srp_16) - A/)-ACV-Andraste
853009= A/)-ACV-Andraste
853010= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Technocracy of Auxo is a secretive transhumanist society dedicated to the advancement of science, the responsible custodianship of knowledge, and the preservation of sentient life. They favor isolationism as a tactic to safeguard themselves and further their internal academic freedom, relying upon a discreet network of agents and collaborators to observe and interact with the outside world.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>The Technocracy's ideals put them at odds with entities such as The Core and Order, whose greed and wrath against non-humans like the Gammu are seen as counter-productive to the advancement of all species and societies. In spite of the Technocrats' isolation and distrustful outlook towards outsiders, they are known to welcome those from all walks of life should they display true dedication to the cause, presenting themselves as a new form of unity above and outside internecine human struggles.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Independent Intelligence official faction ID is used by technocrats of the Technocracy of Auxo, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack Core and Intelligence ships.</TEXT><PARA/><TEXT>- Can demand Alien materials and Cardamine.</TEXT><PARA/><TEXT>- Cannot use Cruisers, Battlecruisers, Battleships, or ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Bretonia +1, Liberty, Inverness, Kansas, Ontario, Vespucci, Omegas, Omicrons</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships considered hostile by the Technocracy of Auxo.</TEXT><PARA/><TEXT>- Can enforce laws within Inverness, Omega-48, Omicron Pi, Ontario, Kansas, and Vespucci.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TEXT>Mining Bonuses: Azurite Gas (4x), Xeno Relics (4x)</TEXT><PARA/><TEXT> </TEXT><PARA/><POP/></RDL>

