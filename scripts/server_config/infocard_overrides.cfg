852987= Infinity ID
852988= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Infinity is a custom exploration vessel and field laboratory derived from the Ikazuchi destroyer class, with heavy modifications. The ship was designed and built by Ionic Incorporated, a subsidiary of Kishiro Technologies, as a testbed for experimental ship-board technology, especially related to hyperspace manipulation, to safeguard the company's premier position in the field.</TEXT><PARA/><PARA/><TEXT>This Kusari Corporate ID is used by Ionic|Infinity, which:</TEXT><PARA/><PARA/><TEXT>- Can attack Blood Dragons, Farmers Alliance, and Golden Chrysanthemums.</TEXT><PARA/><TEXT>- Can engage in piracy against competitors outside of House Space.</TEXT><PARA/><TEXT>- Cannot use Battlecruisers or Battleships.</TEXT><PARA/><PARA/><TEXT>Within Zone of Influence (Kusari +1, Liberty, Sigmas, Taus):</TEXT><PARA/><PARA/><TEXT>- Can attack ships considered hostile by Kusari.</TEXT><PARA/><TEXT>- Can attack competitors outside of Kusari.</TEXT><PARA/><TEXT>- Can engage in piracy against Corporate ships outside of Kusari.</TEXT><PARA/><POP/></RDL>

