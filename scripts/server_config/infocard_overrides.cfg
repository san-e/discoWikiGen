853693=Xeno Alliance ID
853694= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>Terrorists focused on Liberty's greater interests. They prefer to assault foreign interests, civilian or military, but have been known to be violent and unpredictable with anyone seemingly opposing their vision. Secretly they seek a hostile takeover of the Cardamine black market to control the aristocracy and wage a radical revolt, they are also rumored to receive underhand funding from sympathetic elements in Liberty and control a portion of the black market.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Liberty Unlawful official faction ID is used by members of the Xenos Alliance, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack Hogosha and Junkers.</TEXT><PARA/><TEXT>- Cannot use Cruisers, Battlecruisers, Battleships, or ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Liberty +1, Copernicus, Coronado, Inverness, Shikoku, Vespucci</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack any ship, except Liberty Corporate ships.</TEXT><PARA/><TEXT>- Can demand cargo.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TEXT>Mining Bonuses: Copper Ore (3.5x)</TEXT><PARA/><TEXT> </TEXT><PARA/><POP/></RDL>

