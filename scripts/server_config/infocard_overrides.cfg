853686= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Crayter Republic was formed from the remains of an experimental sleeper ship program, launched prior to the Alliance-Coalition War. Forced to abandon their initially colonized worlds due to a natural disaster, the Crayterians evacuated in a ragtag fleet that eventually arrived in Sirius.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Independent Military official faction ID is used by Crayter Republic pilots, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack Gallic Royalists and Outcasts.</TEXT><PARA/><TEXT>- Cannot use ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Coronado +1, Taus +1, Magellan</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack any ship considered hostile by Crayter.</TEXT><PARA/><TEXT>- Can enforce laws within Coronado and the Taus.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TEXT>Outside Zone of Influence:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- May only attack in self-defense while using Cruisers, Battlecruisers, or Battleships.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TEXT>Mining Bonuses: Copper Ore (3.5x)</TEXT><PARA/><TEXT> </TEXT><PARA/><POP/></RDL>

