852649=Nomad ID
852650=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Nomads are organic guardians left behind by an ancient alien civilization. Over thousands of years, Nomads evolved into well-organized beings, forming a civilization of their own - one that is extremely hostile to all save their former masters.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Alien ID is used by Nomads, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack any ship to protect allied Alien ships.</TEXT><PARA/><TEXT>- Cannot engage in piracy.</TEXT><PARA/><TEXT>- Cannot leave their Zone of Influence except when alongside a ship carrying an Alien official faction ID, or while flying a Nomad Light Fighter.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Omicrons +1, Omegas, Taus, Sigmas, and systems containing an allied Alien base</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack any ship.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

