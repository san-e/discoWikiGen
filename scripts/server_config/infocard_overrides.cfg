37368=Wendigo (Central) ID
37369=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>Products of Vagrant influence and infestation, the so-called "Wendigos" are Vagrant-controlled puppets, infiltrators, and saboteurs. Infiltration and subterfuge is their primary modus operandi, though they are known to engage in overt acts of terrorism in pursuance of the Vagrants' inscrutable plans.</TEXT><PARA/><PARA/><TEXT>This Alien ID is used by Wendigos, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Cannot demand credits.</TEXT><PARA/><TEXT>- Cannot use Cruisers, Battlecruisers, Battleships, or ships with more than 3,600 cargo space.</TEXT><PARA/><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Liberty +1, Kusari, Taus, Coronado, Manchester, Newcastle, and systems containing an allied Alien base</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack combat ships.</TEXT><PARA/><TEXT>- Can demand cargo.</TEXT><PARA/><TEXT>- Can attack any ship within Inverness, Ontario, Tau-61, and Vespucci.</TEXT><PARA/><PARA/><TRA color="default"/><POP/></RDL>

