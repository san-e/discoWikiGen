787195=Unsettling Node
787196=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TRA data="1" mask="1" def="-2"/><JUST loc="center"/><TEXT>UNSETTLING NODE</TEXT><PARA/><TRA data="0" mask="1" def="-1"/><TRA color="default" bold="default"/><JUST loc="left"/><TEXT> </TEXT><PARA/><TEXT>This object appears to be an Alien Artifact fabricated from a blended combination of exotic crystalline lattices and organic materials. It is not clear what the item's function is, however it was observed being carried by a major Nomad warform deep within the Sigma sector.</TEXT><PARA/><POP/></RDL>

