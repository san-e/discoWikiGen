853703=OS&C| Orbital Spa and Cruise ID
853704=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>Orbital Spa and Cruise has taken over the remains of the former Company that was left after the Gallic War. Striving to rebuild it from the ground up and search for new opportunities, its employees live by the motto The Tide Lifts all Boats and will even work together with competitors. To maintain a superior position, in the holiday and luxury marketplace, Orbital Spa and Cruise has four Departments, which work together to successfully run the Enterprise: White Star Lines, Triton Expeditions, Orbital Network Express and Orbital Security.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Independent Corporate official faction ID is used by Orbital Spa and Cruise employees, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can engage in piracy against competitors outside of House Space.</TEXT><PARA/><TEXT>- Cannot use Cruisers, Battlecruisers, or Battleships.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Cortez +1, Stuttgart +1</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships considered hostile by OS&amp;C.</TEXT><PARA/><TEXT>- Can attack competitors outside of House Space.</TEXT><PARA/><TEXT>- Can engage in piracy against Corporate ships outside of House Space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

