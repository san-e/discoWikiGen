852863=Rheinland Diplomatic Corps ID
852864=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TRA data="1" mask="1" def="-2"/><JUST loc="center"/><TEXT>Diplomatic Corps</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA data="0" mask="1" def="-1"/><JUST loc="left"/><TEXT>Diplomats are those individuals appointed to conduct negotiations of an official or a more clandestine nature. When a grander gesture is needed than mere neural net communications, these men and women are sent abroad, fully empowered to make decisions on behalf of the House they represent.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Diplomatic Corps ID is used by members of a House diplomatic corps, who:</TEXT><PARA/><TEXT>- Cannot use Cruisers or Battleships.</TEXT><PARA/><TEXT>- Cannot use ships with more than 2700 cargo space, except the Luxury Liner.</TEXT><PARA/><TEXT>- Can only attack in self-defense.</TEXT><PARA/><POP/></RDL>

