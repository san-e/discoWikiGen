852583=Kishiro Technologies ID
852584=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>Kishiro Technologies is one of two Kusari megacorporations, best known for their developments in Optronics, optical computing systems that power the information superhighways of Sirius. Their work in FTL travel has also fostered a fierce rivalry with competing firms Ageira, DSE, and EFL.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Kusari Corporate ID is used by Kishiro Technologies employees, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack Blood Dragons, Farmers Alliance, and Golden Chrysanthemums.</TEXT><PARA/><TEXT>- Can engage in piracy against competitors outside of House Space.</TEXT><PARA/><TEXT>- Cannot use Cruisers, Battlecruisers, or Battleships.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Kusari +1, Sigmas, Taus</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships considered hostile by Kusari.</TEXT><PARA/><TEXT>- Can attack competitors outside of Kusari.</TEXT><PARA/><TEXT>- Can engage in piracy against Corporate ships outside of Kusari.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TEXT>Mining Bonuses: Aluminium Ore (3x), Helium-3 (3x), Platinum Ore (3x)</TEXT><PARA/><TEXT> </TEXT><PARA/><POP/></RDL>

