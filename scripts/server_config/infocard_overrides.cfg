852999= Festus McBoyle
853000= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Junkers are a group of smugglers and black market traders who maintain a legal front through scrap peddling. They are rumored to deal with a lot of unlawful factions, but are enemies of the Xenos and the Hogosha.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Independent Quasilegal SRP ID is used by Festus McBoyle, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack Hogosha and Xenos.</TEXT><PARA/><TEXT>- Cannot use Cruisers, Battlecruisers, or Battleships.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

