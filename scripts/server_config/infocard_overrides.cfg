852996= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TRA bold="true"/><JUST loc="center"/><TEXT>*L|AFS-Abaddon</TEXT><PARA/><TEXT></TEXT><PARA/><TRA bold="default"/><JUST loc="left"/><TEXT></TEXT><PARA/><TEXT>This Independent Quasi-lawful ID is used by the Abaddon, which:</TEXT><PARA/><TRA color="white"/><TEXT></TEXT><PARA/><TEXT>- Can attack any ship carrying Artifacts, Stabiline or Nox.</TEXT><PARA/><TEXT>- Can attack any hostile ship in Omicron Alpha</TEXT><PARA/><TEXT></TEXT><PARA/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (Bretonia, Kusari, Liberty, Omicrons, Sigmas, Taus, Coronado, Cortez, Galileo, Inverness, Kepler, Languedoc, Magellan, Ontario): </TEXT><PARA/><TRA color="white"/><TEXT></TEXT><PARA/><TEXT>- Can attack combat ships.</TEXT><PARA/><TEXT>- Can engage in piracy.</TEXT><POP/></RDL>

