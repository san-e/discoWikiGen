;SRP 24 (dsy_license_srp_24) - Ki'Shar
853148= Ki'Shar
853149= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>Kis'Har is former Normandy class battleship, RNS Charente, which used to serve in Gallic Royal Navy and later in Gallic Royal Enclave. Later Charente had to retreat to Omicrons after The Order revealed its true purpose and affiliation to the Enclave high command. With lack of resources and damage done through months of service in Aoi, it was decided to make a hybrid of old Valor and alien ship in order to get rid of dependence on fuel and parts of Gallic origin. Kis'Har is now alive with its mind connected to Mindshare through Lauren La'Row's body and mind.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Alien SRP ID is used by the infected battleship Kis'Har, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack any ship to protect allies.</TEXT><PARA/><TEXT>- Cannot demand credits.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Bretonia, Gallia, Kusari, Omegas, Omicrons, Sigmas, Taus, Dublin, and systems containing an allied Alien base</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack any ship.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

;SRP 25 (dsy_license_srp_25) - LNS-Akhetaten
853150= LNS-Akhetaten
853151= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The LNS-Akhetaten operates autonomously throughout the Independent Worlds, serving as a self-appointed guardian against alien forces. The ship's Flag Officer, Vice Admiral Maria Uhmen, has pushed for and received unique rules of engagement that allow the warship to see her mission of defending the Republic against any threats through. The Akhetaten is equipped with state-of-the-art weaponry and sensor technology that allow it to study, analyze, and obliterate threats of any form wherever they appear.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Liberty Military official faction SRP ID is used by the LNS-Akhetaten, who:</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>- Can attack ships considered hostile by Liberty.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>- Can demand alien equipment and materials.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>- Can extend the Zone of Influence of TFA- tagged ships to its current system, with the exception of Battlecruisers and Battleships.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>Within Zone of Influence (Liberty +1, Coronado, Vespucci, Shikoku):</TEXT><PARA/><TEXT>- Can attack Kusari combat ships.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>- Can demand Superconductors and Nanocapacitors in Galileo and Kepler.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>- Can enforce laws within Liberty.</TEXT><PARA/><POP/></RDL>

;SRP 26 (dsy_license_srp_26) - Amenhotep
853152=Amenhotep ID
853153=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>After the fall of Toledo the wreck of the Amenhotep was discovered by Order Agent Jonathan Kalh, and towed from Omicron Minor to Fort Carthage for repair. Impressed with Kalh's dedication, the Order made him the vessel's Captain and deployed him to Liberty and the surrounding systems. Later betrayed by the Order after aiding them in the destruction of a Nomad Hypergate in Coronado, Kalh sought refuge in the Liberty Navy 5th Fleet. Years later Kalh's mental state had deteriorated, causing him to break off from the 5th and seek out his own destiny. Unprepared for what awaited him in the Omicrons, Kalh was mortally wounded and his body was placed in a mechanical life-support suit. Reborn, he would soon change his name to Asmodeus and begin a crusade against what he called "Corruption".</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack any ship.</TEXT><PARA/><TEXT>- Can demand Artifacts, Azurite Gas, and Nomad equipment or materials.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

