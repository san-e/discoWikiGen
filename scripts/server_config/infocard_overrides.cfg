852595=Synth Foods ID
852596=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>Synth Foods is the Liberty firm responsible for the revolutionary food product Synth Paste, and a highly successful line of food-producing biodomes. The company maintains a close commercial relationship with many independent organizations who rely on Synth Foods biodomes to provide sustenance far from civilization.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Liberty Corporate ID is used by employees of Synth Foods, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack Farmers Alliance and LWB ships anywhere.</TEXT><PARA/><TEXT>- Can engage in piracy against competitors outside of House Space.</TEXT><PARA/><TEXT>- Cannot use Cruisers, Battlecruisers, or Battleships.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Liberty +1, Rheinland, Sigmas, Shikoku</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships considered hostile by Liberty.</TEXT><PARA/><TEXT>- Can attack Samura and Hogosha ships outside of House Space.</TEXT><PARA/><TEXT>- Can engage in piracy against Corporate ships outside of House Space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

