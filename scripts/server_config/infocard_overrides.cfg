852629=Bundschuh ID
852630=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Bundschuh are a populist political organization declared an enemy of the state by the Rheinland government. A loosely organized confederation of dissident tendencies ranging from progressive to far-leftist, it has substantial support from Rheinland's underclasses and intelligensia alike.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Rheinland Unlawful ID is used by members of the Bundschuh, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Cannot use Cruisers, Battlecruisers, Battleships, or ships with more than 4,300 cargo space.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Rheinland +1, Sigmas, Omega-3, Pennsylvania, Texas, Zurich</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack combat ships.</TEXT><PARA/><TEXT>- Can engage in piracy.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

