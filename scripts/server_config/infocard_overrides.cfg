787207=Niyodo's Reactor Module
787208=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TRA data="1" mask="1" def="-2"/><JUST loc="center"/><TEXT>NIYODO'S REACTOR MODULE</TEXT><PARA/><TRA data="0" mask="1" def="-1"/><JUST loc="left"/><TEXT> </TEXT><PARA/><TEXT>The reactor module of the fated experimental ship IKN-Niyodo, outfitted to withstand the trials of the Earhart system. Diagnostic information about its last mission may still be available within its databanks. Strange emanations can be detected from the object with even the most rudimentary wideband sensor.</TEXT><PARA/><POP/></RDL>

;commodity_event_39 (1000 Cargo)

787209=  Databanks
787210=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TRA data="1" mask="1" def="-2"/><JUST loc="center"/><TEXT>DATABANKS</TEXT><PARA/><TRA data="0" mask="1" def="-1"/><JUST loc="left"/><TEXT> </TEXT><PARA/><TEXT>The next stage in the production pipeline of establishing a spaceworthy installation is the combination of Optronic arrays into large clusters. Once the neuron-like gossamer strands network together in sufficient numbers, the complex web of information necessary to troubleshoot the myriad of problems of an installation in the void becomes operational. Because the whole of these arrays is greater than the sum of its parts, they cannot be easily separated into their constituent components, and are therefore rarely seen outside of large industrial relocation and construction operations.</TEXT><PARA/><POP/></RDL> 

