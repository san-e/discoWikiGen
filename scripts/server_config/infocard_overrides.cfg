852590=<?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Border World Exports Shipping Company is a pioneer in the exploration of the Border Worlds, and the preferred supplier of the Bretonian government. The bulk of their contracts are the result of a direct partnership with Bretonia Mining and Manufacturing, providing shipping of their raw materials and finished goods at an extremely competitive rate.</TEXT><PARA/><TEXT> </TEXT><PARA/><TEXT>This Bretonian Corporate ID is used by Border World Exports employees, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can engage in piracy against competitors outside of House Space.</TEXT><PARA/><TEXT>- Cannot use Cruisers, Battlecruisers, or Battleships.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><TRA color="default" bold="true"/><TEXT>Within Zone of Influence (</TEXT><TRA bold="default"/><TEXT>Bretonia +1, Omegas, Taus</TEXT><TRA bold="true"/><TEXT>):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships considered hostile by Bretonia.</TEXT><PARA/><TEXT>- Can attack competitors outside of Bretonia.</TEXT><PARA/><TEXT>- Can engage in piracy against Corporate ships outside of Bretonia.</TEXT><PARA/><TEXT> </TEXT><PARA/><TRA color="default"/><POP/></RDL>

