852843= (\^/) Phoenix ID
852844= <?xml version="1.0" encoding="UTF-16"?><RDL><PUSH/><TEXT>The Phoenix are a group of nomadic Zoners who have chosen the freedom of the harsh, unforgiving edge worlds over the limits and restrictions of colonized space.</TEXT><PARA/><TEXT></TEXT><PARA/><TEXT>This Independent Quasilegal official faction ID is used by zoners of the Phoenix, who:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack any ship in defense of an ally.</TEXT><PARA/><TEXT></TEXT><PARA/><TRA color="default"/><TEXT>Within ZOI (Omicrons, Omegas):</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can attack ships considered hostile by Phoenix</TEXT><PARA/><TEXT>- Can engage in piracy</TEXT><PARA/><TEXT>- Can attack any ship in Omicron Zeta</TEXT><PARA/><TEXT></TEXT><PARA/><TRA color="default"/><TEXT>Within House Space:</TEXT><PARA/><TRA color="white" bold="default"/><TEXT>- Can only dock Cruisers, Battlecruisers, or Battleships on Zoner bases.</TEXT><PARA/><TEXT>- Can only dock ships with more than 3,600 cargo on GMG, IMG, and Zoner bases.</TEXT><PARA/><TRA color="default"/><TEXT>Mining Bonuses: Iridium Ore (3.5x)</TEXT><PARA/><TEXT> </TEXT><PARA/><POP/></RDL>

